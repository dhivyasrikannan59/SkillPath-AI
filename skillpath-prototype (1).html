<script>const PAGES={"skillpath-ai-homepage.html": "<!DOCTYPE html>\n<html lang=\"en\" style=\"color-scheme:light\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>SkillPath AI \u2013 Discover Your Skills. Build Your Future.<\/title>\n<script>/* SkillPath AI shared module v2: session, per-student data, storage safety, login guard, shared navigation.\n   Required data keys stay exactly as specified (sp_users, sp_profile, sp_career, sp_assessment, sp_skillgap,\n   sp_learning_progress, sp_agent_results). Extras: sp_session (who is logged in), sp_assessment_history (score history)\n   and sp_data:<email> (each student's saved copy of the data keys, so accounts never mix).\n   Prototype only: no backend, no real security, no AI model. */\n(function () {\n  const _get = Storage.prototype.getItem, _set = Storage.prototype.setItem, _rm = Storage.prototype.removeItem;\n  const DATA = ['sp_profile','sp_career','sp_assessment','sp_assessment_history','sp_skillgap','sp_learning_progress','sp_agent_results'], BK = 'sp_data:';\n  let storageOk = true; try { _set.call(localStorage, 'sp__t', '1'); _rm.call(localStorage, 'sp__t'); } catch (e) { storageOk = false; }\n  const raw = k => { try { return _get.call(localStorage, k); } catch (e) { return null; } };\n  const read = (k, d) => { try { const v = raw(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };\n  const sessEmail = () => { const s = read('sp_session', null); return s && typeof s.email === 'string' ? s.email : ''; };\n  const bundleSave = email => { if (!email) return; try { const b = {}; DATA.forEach(k => { const v = raw(k); if (v !== null) b[k] = v; }); _set.call(localStorage, BK + email, JSON.stringify(b)); } catch (e) {} };\n  const clearData = () => DATA.forEach(k => { try { _rm.call(localStorage, k); } catch (e) {} });\n  /* Every write to a data key is mirrored into the logged-in student's own bundle. */\n  Storage.prototype.setItem = function (k, v) { _set.call(this, k, v); if (this === localStorage && DATA.includes(k)) bundleSave(sessEmail()); };\n  Storage.prototype.removeItem = function (k) { _rm.call(this, k); if (this === localStorage && DATA.includes(k)) bundleSave(sessEmail()); };\n\n  const SP = window.SP = {\n    storageOk,\n    hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); },\n    users() { const u = read('sp_users', []); return Array.isArray(u) ? u.filter(x => x && typeof x.email === 'string') : []; },\n    session() { const s = sessEmail(); return s && SP.users().some(u => u.email === s) ? { email: s } : null; },\n    /* Switch the active student: save the previous student's data, then load this student's data (or start clean). */\n    login(email) {\n      if (!storageOk) return false;\n      const us = SP.users(), i = us.findIndex(u => u.email === email); if (i < 0) return false;\n      try {\n        const cur = sessEmail();\n        if (cur !== email) {\n          if (cur) bundleSave(cur);\n          else { const pe = (read('sp_profile', {}) || {}).email; if (pe && pe !== email && raw(BK + pe) === null) bundleSave(pe); }   // keep data from older single-user versions\n          const mine = raw(BK + email), legacy = !cur && mine === null && ((read('sp_profile', {}) || {}).email === email);\n          if (!legacy) { clearData(); if (mine) { const b = JSON.parse(mine); Object.keys(b).forEach(k => DATA.includes(k) && _set.call(localStorage, k, b[k])); } }\n        }\n        us.push(us.splice(i, 1)[0]);      // existing pages treat the LAST user in sp_users as the current student\n        _set.call(localStorage, 'sp_users', JSON.stringify(us));\n        _set.call(localStorage, 'sp_session', JSON.stringify({ email, at: new Date().toISOString() }));\n        bundleSave(email); return true;\n      } catch (e) { return false; }\n    },\n    /* Called when a student changes their email in the profile, so the login and saved data follow the new email. */\n    rename(oldE, newE) {\n      if (!oldE || !newE || oldE === newE) return;\n      try { const b = raw(BK + oldE); if (b !== null) { _set.call(localStorage, BK + newE, b); _rm.call(localStorage, BK + oldE); }\n        if (sessEmail() === oldE) _set.call(localStorage, 'sp_session', JSON.stringify({ email: newE, at: new Date().toISOString() })); bundleSave(newE); } catch (e) {}\n    },\n    logout() { const cur = sessEmail(); bundleSave(cur); clearData(); try { _rm.call(localStorage, 'sp_session'); } catch (e) {} SPNAV('skillpath-ai-homepage.html'); }\n  };\n  const SPNAV = window.SPNAV = window.SPNAV || (u => { SPNAV(u); });\n  const page = window.__SP_PAGE || location.pathname.split('/').pop() || 'skillpath-ai-homepage.html';\n  const APP = ['profile.html','assessment.html','skill-gap.html','learning-recommendations.html','dashboard.html','ai-mentor.html','multi-agent.html'];\n  if (APP.includes(page) && !SP.session()) { SPNAV('login.html?next=' + encodeURIComponent(page)); return; }\n\n  const NAV = [['Home','skillpath-ai-homepage.html'],['Profile','profile.html'],['Assessment','assessment.html'],['Skill Gap','skill-gap.html'],['Learning','learning-recommendations.html'],['Dashboard','dashboard.html'],['AI Mentor','ai-mentor.html'],['Multi-Agent','multi-agent.html']];\n  const li = ([t, h]) => `<li><a class=\"${h === page ? 'rounded-lg bg-bs px-3 py-1 text-bp' : 'rounded-lg px-2 py-1 text-ink/80 transition hover:text-bp'}\" href=\"${h}\"${h === page ? ' aria-current=\"page\"' : ''}>${t}<\/a><\/li>`;\n  const strip = (html, cls) => `<div role=\"note\" class=\"mb-4 rounded-xl border px-4 py-2.5 text-sm ${cls}\">${html}<\/div>`;\n\n  document.addEventListener('DOMContentLoaded', () => {\n    const s = SP.session(), main = document.querySelector('main');\n    if (!storageOk && main) main.insertAdjacentHTML('afterbegin', strip('<b>Browser storage is blocked.<\/b> Nothing you enter can be saved, and sign-in will not work. Allow site data or open this file in a normal (non-private) window.', 'border-red-200 bg-red-50 text-red-800'));\n    if (APP.includes(page)) {\n      const nav = document.querySelector('header nav'), av = document.getElementById('navAv'); if (!nav) return;\n      const logo = nav.querySelector('a[href=\"skillpath-ai-homepage.html\"]');\n      nav.className = 'mx-auto max-w-6xl px-4 sm:px-6'; nav.innerHTML = '';\n      const row = document.createElement('div'); row.className = 'flex h-16 items-center justify-between gap-3';\n      const right = document.createElement('div'); right.className = 'flex items-center gap-2';\n      const out = document.createElement('button'); out.id = 'spLogout'; out.type = 'button'; out.textContent = 'Logout';\n      out.className = 'rounded-lg border-2 border-indigo-600 px-3 py-1 text-sm font-bold text-indigo-600 transition hover:bg-indigo-600 hover:text-white'; out.onclick = SP.logout;\n      if (av) right.append(av); right.append(out);\n      const d = document.createElement('ul'); d.id = 'navDesk'; d.className = 'hidden items-center gap-3 text-sm font-semibold lg:flex'; d.innerHTML = NAV.map(li).join('');\n      const m = document.createElement('ul'); m.id = 'navMob'; m.className = 'flex gap-1 overflow-x-auto whitespace-nowrap pb-2 text-sm font-semibold lg:hidden'; m.innerHTML = NAV.map(li).join('');\n      if (logo) { const sp = logo.querySelector('span.hidden'); if (sp) sp.className = 'hidden xl:inline'; row.append(logo); }\n      row.append(d, right); nav.append(row, m);\n      if (main && !['ai-mentor.html','learning-recommendations.html','multi-agent.html'].includes(page))\n        main.insertAdjacentHTML('afterbegin', strip('<b>Rule-based simulation.<\/b> Scores, gaps and suggestions come from fixed rules running in your browser. No real AI model or online service is connected.', 'border-violet-200 bg-violet-50 text-violet-800'));\n    } else if (page === 'skillpath-ai-homepage.html' && s) {\n      document.querySelectorAll('a[href=\"login.html\"]').forEach(a => { a.textContent = 'Dashboard'; a.href = 'dashboard.html'; });\n      document.querySelectorAll('a[href=\"register.html\"]').forEach(a => {\n        if (a.closest('header')) { a.textContent = 'Logout'; a.href = '#'; a.addEventListener('click', e => { e.preventDefault(); SP.logout(); }); }\n        else a.href = 'dashboard.html';\n      });\n    }\n    document.querySelectorAll('[data-soon]').forEach(a => a.removeAttribute('data-soon'));\n  });\n})();\n<\/script>\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n<script src=\"https://cdn.tailwindcss.com/3.4.17\"><\/script>\n<script>\ntailwind.config = { theme: { extend: {\n  fontFamily: { sans: ['\"Plus Jakarta Sans\"', 'system-ui', 'sans-serif'] },\n  colors: { ink: '#1e1b4b', bb: '#2563eb', bp: '#7c3aed', bs: '#f5f3ff' },\n  keyframes: { float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },\n               up: { from: { opacity: 0, transform: 'translateY(24px)' }, to: { opacity: 1, transform: 'none' } } },\n  animation: { float: 'float 5s ease-in-out infinite', slow: 'float 7s ease-in-out infinite', up: 'up .8s ease-out both' }\n} } }\n<\/script>\n<style type=\"text/tailwindcss\">\n  html{scroll-behavior:smooth;scroll-padding-top:5rem}\n  body{@apply font-sans text-ink bg-white antialiased}\n  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}\n  a:focus-visible,button:focus-visible{@apply outline outline-2 outline-offset-2 outline-bp}\n  .btn{@apply inline-flex items-center justify-center gap-2 rounded-xl px-6 py-3 font-bold transition hover:-translate-y-0.5}\n  .btn-p{@apply btn bg-gradient-to-r from-bb to-bp text-white shadow-lg shadow-indigo-500/25 hover:shadow-xl}\n  .btn-o{@apply btn border-2 border-indigo-600 bg-white text-indigo-600 hover:bg-indigo ta Analyst<\/p><\/div><span class=\"rounded-full bg-violet-100 px-3 py-1 text-xs font-bold text-bp\">72% ready<\/span><\/div>\n        <div class=\"space-y-4\" id=\"bars\"><\/div>\n        <div class=\"mt-5 flex items-center gap-2 rounded-xl bg-violet-50 p-3 text-sm\"><i data-i=\"book\" data-s=\"18\" class=\"text-bp\"><\/i><span>Next: <b>Build a Power BI dashboard<\/b><\/span><\/div>\n      <\/div>\n      <div class=\"animate-float absolute -left-4 top-10 hidden items-center gap-2 rounded-xl bg-white px-3 py-2 text-sm font-bold shadow-lg sm:flex\"><i data-i=\"check\" data-s=\"18\" class=\"text-emerald-500\"><\/i> Python verified<\/div>\n      <div class=\"animate-slow absolute -right-3 bottom-16 hidden items-center gap-2 rounded-xl bg-white px-3 py-2 text-sm font-bold shadow-lg sm:flex\"><i data-i=\"trend\" data-s=\"18\" class=\"text-bb\"><\/i> 3 gaps found<\/div>\n      <div class=\"animate-float absolute -bottom-5 left-8 hidden items-center gap-2 rounded-xl bg-gradient-to-r from-bb to-bp px-3 py-2 text-sm font-bold text-white shadow-lg sm:flex\"><i data-i=\"target\" data-s=\"18\"><\/i> Roadmap ready<\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ABOUT -->\n<section id=\"about\" class=\"py-20 sm:py-24\">\n  <div class=\"mx-auto grid max-w-6xl items-center gap-12 px-4 sm:px-6 lg:grid-cols-2\">\n    <div class=\"reveal\">\n      <h2 class=\"text-3xl font-extrabold sm:text-4xl\">Many students study hard but don\u2019t know what to learn next<\/h2>\n      <p class=\"mt-5 text-slate-600\">SkillPath AI connects your current skills with the requirements of your dream career. It finds the gaps, then builds a personalized roadmap of courses and projects, so every hour of learning counts.<\/p>\n      <p class=\"mt-4 text-slate-600\">Whether you are in your first year or about to graduate, you get a clear, step-by-step plan to become job-ready.<\/p>\n    <\/div>\n    <ul class=\"space-y-4\" id=\"about-list\"><\/ul>\n  <\/div>\n<\/section>\n\n<!-- FEATURES -->\n<section i a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2m1 10 2 2 4-4\"/>',\n  chip:'<rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"2\"/><rect x=\"9\" y=\"9\" width=\"6\" height=\"6\"/><path d=\"M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3\"/>',\n  map:'<path d=\"M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15\"/>',\n  user:'<path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/>',\n  mail:'<rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"/><path d=\"m22 7-10 5L2 7\"/>',\n  building:'<path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-4h6v4M9 10h.01M15 10h.01M9 13h.01M15 13h.01\"/>',\n  cap:'<path d=\"M22 10 12 5 2 10l10 5zM6 12v5c3 3 9 3 12 0v-5\"/>',\n  cal:'<rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M16 2v4M8 2v4M3 10h18\"/>',\n  lock:'<rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"/>',\n  eye:'<path d=\"M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>',\n  eyeoff:'<path d=\"M9.9 4.2A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3 3.9M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M2 2l20 20\"/>',\n  arrow:'<path d=\"M5 12h14M12 5l7 7-7 7\"/>',\n  check:'<path d=\"M20 6 9 17l-5-5\"/>'\n};\nconst icon = (n, s, c = '') => `<svg class=\"${c}\" width=\"${s}\" height=\"${s}\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${P[n]}<\/svg>`;\ndocument.querySelectorAll('i[data-i]').forEach(el => el.outerHTML = icon(el.dataset.i, el.dataset.s || 20, el.className));\nconst $ = id => document.getElementById(id);\n\n/* ---- Validation rules (one place, easy to reuse for the Login page) ---- */\nconst rules = {\n  name:    v => v.trim().length < 2 ? 'Enter your full name (at least 2 characters).' : !/^\\p{L}[\\p{L} .'-]*$/u.test(v.trim()) ? 'Use letters only in your name.' : '',\n  email:   v => !v.trim() ? 'Enter your email address.' : !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(v.trim()) ? 'Enter a valid email, like you@college.edu.' : '',\n  college: v => v.trim().length < 3 ? 'Enter your college name.' : '',\n  dept:    v => !v ? 'Select your department.' : '',\n  year:    v => !v ? 'Select your year of study.' : '',\n  pass:    v => v.length < 8 ? 'Password must be at least 8 characters.' : !/[A-Za-z]/.test(v) || !/\\d/.test(v) ? 'Include at least one letter and one number.' : ''\n};\nconst form = $('regForm');\nfunction formErr(m) { const e = $('formErr'); e.textContent = m; e.classList.remove('hidden'); e.scrollIntoView({ block: 'center' }); }\nfunction check(id) {\n  const el = $(id), msg = rules[id](el.value), e = $('e-' + id);\n  el.setAttribute('aria-invalid', !!msg); el.setAttribute('aria-describedby', 'e-' + id);\n  e.textContent = msg; e.classList.toggle('show', !!msg);\n  return !msg;\n}\nObject.keys(rules).forEach(id => {\n  $(id).addEventListener('blur', () => check(id));\n  $(id).addEventListener('input', () => { if ($(id).getAttribute('aria-invalid') === 'true') check(id); });\n});\n\n/* ---- Password: show/hide + strength ---- */\n$('eye').onclick = () => {\n  const show = $('pass').type === 'password';\n  $('pass').type = show ? 'text' : 'password';\n  $('eye').innerHTML = icon(show ? 'eyeoff' : 'eye', 18);\n  $('eye').setAttribute('aria-label', show ? 'Hide password' : 'Show password');\n};\n$('pass').addEventListener('input', e => {\n  const v = e.target.value;\n  const score = (v.length >= 8) + (/[A-Z]/.test(v) && /[a-z]/.test(v) && /\\d/.test(v)) + (v.length >= 12 && /[^A-Za-z0-9]/.test(v));\n  const col = ['bg-slate-200', 'bg-red-400', 'bg-amber-400', 'bg-emerald-500'][v ? Math.max(score, 1) : 0];\n  document.querySelectorAll('[data-seg]').forEach((s, i) => s.className = 'h-1.5 flex-1 rounded-full ' + (i < score || (v && i === 0) ? col : 'bg-slate-200'));\n  $('strength').textContent = v ? ['Weak','Weak','Good','Strong'][score] + ' password' : 'Use 8+ characters with at least one letter and one number.';\n});\n\n/* ---- Submit (frontend only: saves profile in this browser's localStorage) ---- */\nform.addEventListener('submit', e => {\n  e.preventDefault(); $('formErr').classList.add('hidden');\n  const ok = Object.keys(rules).map(check).every(Boolean);   // run all checks\n  if (!ok) { form.querySelector('[aria-invalid=\"true\"]').focus(); return; }\n\n  const user = { name: $('name').value.trim(), email: $('email').value.trim().toLowerCase(), college: $('college').value.trim(),\n                 department: $('dept').value, year: $('year').value, createdAt: new Date().toISOString(), pw: SP.hash($('pass').value) };\n  // Demo only: a simple hash of the password is kept so the Login page can check it. Not real security.\n  if (!SP.storageOk) return formErr('Browser storage is blocked, so an account cannot be saved. Allow site data or use a normal (non-private) window, then try again.');\n  const users = SP.users();\n  if (users.some(u => String(u.email).toLowerCase() === user.email)) {\n    $('e-email').textContent = 'An account with this email already exists. Try logging in instead.'; $('e-email').classList.add('show');\n    $('email').setAttribute('aria-invalid', 'true'); $('email').focus(); return;\n  }\n  users.push(user);\n  try { localStorage.setItem('sp_users', JSON.stringify(users)); } catch (err) { return formErr('Your account could not be saved because browser storage is full or blocked.'); }\n  if (!SP.login(user.email)) return formErr('Your account was saved, but we could not start your session. Please go to Login.');\n\n  $('who').textContent = user.name.split(' ')[0];\n  $('formWrap').classList.add('hidden'); $('done').classList.remove('hidden');\n  window.scrollTo({ top: 0, behavior: 'smooth' });\n});\n\n/* ---- Login placeholders ---- */\nlet tt; document.querySelectorAll('[data-soon]').forEach(a => a.addEventListener('click', e => {\n  e.preventDefault(); const t = $('toast'); t.style.op 0 15 15 0 0 1 0-20\"/>',\n  layers:'<path d=\"m12 2 10 5-10 5L2 7zM2 17l10 5 10-5M2 12l10 5 10-5\"/>',\n  check:'<path d=\"M20 6 9 17l-5-5\"/>', x:'<path d=\"M18 6 6 18M6 6l12 12\"/>',\n  star:'<path d=\"m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z\"/>',\n  refresh:'<path d=\"M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5\"/>',\n  list:'<path d=\"M10 6h11M10 12h11M10 18h11M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17\"/>',\n  user:'<path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/>'\n};\nconst icon = (n, s, c = '') => `<svg class=\"${c}\" width=\"${s}\" height=\"${s}\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${P[n] || P.target}<\/svg>`;\nconst hydrate = root => root.querySelectorAll('i[data-i]').forEach(el => el.outerHTML = icon(el.dataset.i, el.dataset.s || 20, el.className));\nconst $ = id => document.getElementById(id);\nconst esc = s => String(s ?? '').replace(/[&<>\"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '\"':'&quot;', \"'\":'&#39;' }[c]));\n\n/* =====================================================================\n   2) SAMPLE QUESTIONS  (edit or add your own here)\n   Each question: skill, q (question), options (4 choices), answer (index 0-3 of the correct option), why (short explanation)\n   ===================================================================== */\nconst QUESTIONS = [\n  // HTML\n  { skill:'HTML', q:'Which tag creates the largest, top-level heading?', options:['<h1>','<head>','<header>','<title>'], answer:0, why:'<h1> is the top-level heading. <head> and <title> belong to the page metadata.' },\n  { skill:'HTML', q:'Which attribute gives an image text that screen readers can read?', options:['src','alt','title','href'], answer:1, why:'The alt attribute describes the image for screen readers and when the image fails to load.' },\n  { skill:'HTML', q:'Which element is meant for a group of main navigation links?', options:['<div>','<section>','<nav>','<aside>'], answer:2, why:'<nav> tells browsers and assistive tools that the links inside are for navigation.' },\n  // CSS\n  { skill:'CSS', q:'Which property changes the color of text?', options:['font-color','text-color','color','foreground'], answer:2, why:'In CSS, the color property sets the text color.' },\n  { skill:'CSS', q:'Which declaration lets child items line up in a flexible row?', options:['display: block','display: flex','display: inline','display: table'], answer:1, why:'display: flex turns the parent into a flex container so children can be laid out flexibly.' },\n  { skill:'CSS', q:'In the CSS box model, which part is the space outside an element\u2019s border?', options:['Margin','Padding','Content','Outline width'], answer:0, why:'Margin is the outer space. Padding is the space between the content and the border.' },\n  // JavaScript\n  { skill:'JavaScript', q:'Which keyword declares a variable that cannot be reassigned?', options:['let','var','const','static'], answer:2, why:'const creates a binding that cannot be reassigned. let and var can be reassigned.' },\n  { skill:'JavaScript', q:'What does console.log(typeof 42) print?', options:['number','string','integer','undefined'], answer:0, why:'JavaScript has one number type, so typeof 42 is \"number\".' },\n  { skill:'JavaScript', q:'Which array method adds an item to the end?', options:['pop()','push()','shift()','splice()'], answer:1, why:'push() adds to the end. pop() removes from the end and shift() removes from the start.' },\n  // Python\n  { skill:'Python', q:'What does print(len([1, 2, 3])) output?', options:['2','3','4','An error'], answer:1, why:'len() counts the items in the list, and there are 3.' },\n  { skill:'Python', q:'Which keyword defines a function in Python?', options:['function','define','def','func'], answer:2, why:'Python functions start with the def keyword.' },\n  { skill:'Python', q:'What type of value is {\"a\": 1}?', options:['list','tuple','set','dict'], answer:3, why:'Curly braces with key: value pairs make a dictionary (dict).' },\n  // SQL\n  { skill:'SQL', q:'Which statement is used to read data from a table?', options:['SELECT','GET','FETCH','OPEN'], answer:0, why:'SELECT retrieves rows and columns from a table.' },\n  { skill:'SQL', q:'Which clause filters rows by a condition?', options:['ORDER BY','GROUP BY','WHERE','LIMIT'], answer:2, why:'WHERE keeps only the rows that match your condition.' },\n  { skill:'SQL', q:'Which join returns only rows that have a match in both tables?', options:['LEFT JOIN','INNER JOIN','FULL JOIN','CROSS JOIN'], answer:1, why:'INNER JOIN keeps matching rows only. LEFT JOIN also keeps unmatched rows from the left table.' },\n  // Git & GitHub\n  { skill:'Git & GitHub', q:'Which command saves your staged changes to the project history?', options:['git push','git commit','git add','git clone'], answer:1, why:'git commit records staged changes. git add stages them and git push uploads them.' },\n  { skill:'Git & GitHub', q:'Which command copies a remote repository to your computer?', options:['git clone','git init','git merge','git branch'], answer:0, why:'git clone downloads a full copy of a repository.' },\n  // Data Basics\n  { skill:'Data Basics', q:'What is the mean (average) of 2, 4 and 6?', options:['3','4','5','6'], answer:1, why:'(2 + 4 + 6) \u00f7 3 = 4.' },\n  { skill:'Data Basics', q:'Which chart is best for showing a trend over time?', options:['Pie chart','Line chart','Venn diagram','Tree map'], answer:1, why:'A line chart connects points in time order, so changes are easy to see.' },\n  // Cybersecurity Basics\n  { skill:'Cybersecurity Basics', q:'What does HTTPS add compared with HTTP?', options:['Faster loading','More cookies','Bigger images','An encrypted connection'], answer:3, why:'HTTPS encrypts data between your browser and the website.' },\n  { skill:'Cybersecurity Basics', q:'Which is the best password habit?', options:['Use one password everywhere','Use a long, unique password for each site','Use your birthday','Change one letter each time'], answer:1, why:'Long, unique passwords stop one leaked password from unlocking all your accounts.' },\n  // React.js (added at the end so indexes saved in older results still match)\n  { skill:'React.js', q:'Which React hook adds state to a function component?', options:['useEffect','useState','useRef','useMemo'], answer:1, why:'useState returns the current value and a setter, so a function component can remember data between renders.' },\n  { skill:'React.js', q:'What is JSX?', options:['A database query language','A CSS preprocessor','A syntax extension that lets you write HTML-like markup in JavaScript','A package manager'], answer:2, why:'JSX looks like HTML but is compiled to JavaScript calls that create React elements.' },\n  { skill:'React.js', q:'Which special prop helps React track each item when you render a list with map()?', options:['id','name','index','key'], answer:3, why:'A stable, unique key lets React tell which items were added, removed or reordered.' },\n  // Node.js\n  { skill:'Node.js', q:'Which command installs a package from npm into your project?', options:['npm install','node install','npm start','node get'], answer:0, why:'npm install downloads the package and records it in package.json. npm start runs your start script.' },\n  { skill:'Node.js', q:'In a CommonJS Node.js file, which function loads another module?', options:['include()','require()','load()','attach()'], answer:1, why:'require() loads a module and returns what it exports. JavaScript has no built-in include() or load().' },\n  { skill:'Node.js', q:'What does Node.js let you do?', options:['Style web pages','Design databases visually','Run JavaScript outside the browser, such as on a server','Edit images'], answer:2, why:'Node.js is a runtime built on the V8 engine that runs JavaScript on servers and computers, not only in browsers.' }\n];\nconst SKILLS = [...new Set(QUESTIONS.map(q => q.skill))];\n\n/* Which skills matter most for each career goal (used to highlight results) */\nconst CAREERS = {\n  'Software Developer':    { icon:'code',   key:['JavaScript','Python','SQL','Git & GitHub'] },\n  'Data Analyst':          { icon:'chart',  key:['Python','SQL','Data Basics'] },\n  'AI/ML Engineer':        { icon:'chip',   key:['Python','Data Basics','Git & GitHub'] },\n  'Cybersecurity Analyst': { icon:'shield', key:['Cybersecurity Basics','Python','Git & GitHub'] },\n  'Web Developer':         { icon:'globe',  key:['HTML','CSS','JavaScript','Git & GitHub'] },\n  'Full Stack Developer':  { icon:'layers', key:['HTML','CSS','JavaScript','React.js','Node.js','SQL','Git & GitHub'] }\n};\n\n/* =====================================================================\n   3) STORAGE (localStorage). Keys used by SkillPath AI pages:\n      sp_users, sp_profile, sp_career  \u2192 written by register/profile pages\n      sp_assessment                    \u2192 written here, read by the next stage\n   ===================================================================== */\nconst Store = {\n  json(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },\n  raw(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },\n  save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return !!localStorage.getItem(k); } catch (e) { return false; } }\n};\n\n/* Student name + career goal (career goal is plain text saved by profile/dashboard pages) */\nconst users = Store.json('sp_users', []);\nconst profile = Store.json('sp_profile', null) || (Array.isArray(users) && users.length ? users[users.length - 1] : null) || {};\nconst student = { name: profile.name || 'Student', email: profile.email || '' };\nconst careerRaw = Store.raw('sp_career');\nconst career = CAREERS[careerRaw] ? careerRaw : (CAREERS[profile.goal] ? profile.goal : '');\n\n/* =====================================================================\n   4) STATE\n   ===================================================================== */\nlet current = 0;                                   // index of the question on screen\nlet answers = QUESTIONS.map(() => null);           // chosen option index for each question (null = not answered)\n\n/* =====================================================================\n   5) SCREENS\n   ===================================================================== */\nfunction show(id) {\n  ['intro', 'quiz', 'result'].forEach(s => $(s).classList.toggle('hidden-screen', s !== id));\n  window.scrollTo({ top: 0, behavior: 'smooth' });\n}\n\n/* Intro */\n$('navAv').textContent = student.name.split(' ').filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase() || '?';\n$('hiName').textContent = student.name.split(' ')[0];\n$('goalName').textContent = career || 'Not selected yet';\n$('goalIcon').innerHTML = icon(career ? CAREERS[career].icon : 'target', 22);\n$('noGoal').classList.toggle('hidden', !!career);\n$('qCount').textContent = QUESTIONS.length; $('sCount').textContent = SKILLS.length; $('topics').textContent = SKILLS.join(', ');\n\nlet lastResult = Store.json('sp_assessment', null);\nfunction showLast() {\n  if (lastResult && lastResult.skills) {\n    $('lastBtn').classList.remove('hidden'); $('lastInfo').classList.remove('hidden');\n    $('lastInfo').textContent = `Last result: ${lastResult.percent}% on ${new Date(lastResult.takenAt).toLocaleDateString()}.`;\n  }\n}\nshowLast();\n$('startBtn').onclick = () => { answers = QUESTIONS.map(() => null); current = 0; $('warn').classList.add('hidden'); renderQuestion(); show('quiz'); };\n$('lastBtn').onclick = () => { renderResult(lastResult, false); show('result'); };\n\n/* Quiz */\nfunction renderQuestion() {\n  const q = QUESTIONS[current], total = QUESTIONS.length;\n  const answered = answers.filter(a => a !== null).length;\n  const pct = Math.round(((current + 1) / total) * 100);\n\n  $('progText').textContent = `Question ${current + 1} of ${total}`;\n  $('ansText').textContent = `${answered} answered`;\n  $('progBar').style.width = pct + '%';\n  $('progWrap').setAttribute('aria-valuenow', pct);\n  $('qSkill').textContent = q.skill;\n  $('qText').textContent = q.q;\n\n  $('options').innerHTML = q.options.map((text, i) =>\n    `<button type=\"button\" class=\"opt\" role=\"radio\" aria-checked=\"${answers[current] === i}\" data-opt=\"${i}\"><span class=\"let\">${'ABCD'[i]}<\/span><span>${esc(text)}<\/span><\/button>`).join('');\n\n  $('prevBtn').disabled = current === 0;\n  const last = current === total - 1;\n  $('nextBtn').innerHTML = last ? `Submit Assessment ${icon('check', 18)}` : `Next ${icon('arrow', 18)}`;\n\n  $('dots').innerHTML = QUESTIONS.map((_, i) =>\n    `<button type=\"button\" class=\"dot ${i === current ? 'now' : answers[i] !== null ? 'done' : ''}\" data-go=\"${i}\" aria-label=\"Go to question ${i + 1}${answers[i] !== null ? ' (answered)' : ''}\">${i + 1}<\/button>`).join('');\n}\n\n$('options').addEventListener('click', e => {\n  const b = e.target.closest('[data-opt]'); if (!b) return;\n  answers[current] = +b.dataset.opt;\n  $('warn').classList.add('hidden');\n  renderQuestion();\n});\n$('dots').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) { current = +b.dataset.go; renderQuestion(); } });\n$('prevBtn').onclick = () => { if (current > 0) { current--; renderQuestion(); } };\n$('nextBtn').onclick = () => {\n  if (current < QUESTIONS.length - 1) { current++; renderQuestion(); return; }\n  const missing = answers.filter(a => a === null).length;          // last question: try to submit\n  if (missing) { $('warnN').textContent = missing; $('warn').classList.remove('hidden'); }\n  else submit();\n};\n$('goUnanswered').onclick = () => { current = answers.indexOf(null); $('warn').classList.add('hidden'); renderQuestion(); };\n$('submitAnyway').onclick = submit;\n\n/* =====================================================================\n   6) SCORING + SAVING\n   ===================================================================== */\nconst levelOf = p => p >= 80 ? 'Strong' : p >= 60 ? 'Good' : p >= 40 ? 'Needs practice' : 'Weak';\n\nfunction submit() {\n  // Count correct answers for every skill\n  const skills = SKILLS.map(name => {\n    const qs = QUESTIONS.map((q, i) => ({ q, i })).filter(x => x.q.skill === name);\n    const correct = qs.filter(x => answers[x.i] === x.q.answer).length;\n    const percent = Math.round(correct / qs.length * 100);\n    return { name, correct, total: qs.length, percent, level: levelOf(percent), keySkill: !!career && CAREERS[career].key.includes(name) };\n  });\n  const correct = skills.reduce((s, k) => s + k.correct, 0);\n  const keySkills = skills.filter(k => k.keySkill);\n\n  const result = {\n    takenAt: new Date().toISOString(),\n    student,\n    career,                                                        // career goal at the time of the test\n    total: QUESTIONS.length, correct, percent: Math.round(correct / QUESTIONS.length * 100),\n    goalReadiness: keySkills.length ? Math.round(keySkills.reduce((s, k) => s + k.percent, 0) / keySkills.length) : null,\n    skills,                                                        // skill-wise performance\n    answers: QUESTIONS.map((q, i) => ({ index: i, skill: q.skill, chosen: answers[i], correctOption: q.answer }))\n  };\n  const saved = Store.save('sp_assessment', result);\n  if (saved) { lastResult = result; showLast(); }   // keep \"View last result\" in sync with what was just saved\n  renderResult(result, saved);\n  show('result');\n  toast(saved ? 'Results saved for the Skill Analysis stage.' : 'Could not save: browser storage is blocked.');\n}\n\n/* =====================================================================\n   7) RESULTS\n   ===================================================================== */\nfunction renderResult(r, saved) {\n  const label = r.percent >= 80 ? 'Excellent work!' : r.percent >= 60 ? 'Good job!' : r.percent >= 40 ? 'Keep practicing' : 'A good starting point';\n  const col = p => p >= 80 ? 'from-emerald-400 to-emerald-600' : p >= 60 ? 'from-bb to-bp' : p >= 40 ? 'from-amber-300 to-amber-500' : 'from-red-400 to-red-500';\n  const tag = p => p >= 80 ? 'bg-emerald-100 text-emerald-700' : p >= 60 ? 'bg-violet-100 text-violet-700' : p >= 40 ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700';\n  const focus = [...r.skills].filter(k => k.percent < 80).sort((a, b) => (b.keySkill - a.keySkill) || (a.percent - b.percent)).slice(0, 3);\n  const C = 326.7;\n\n  $('result').innerHTML = `\n  <div class=\"animate-up\">\n    <div class=\"relative overflow-hidden rounded-3xl bg-gradient-to-br from-bb via-indigo-600 to-bp p-7 text-white shadow-2xl shadow-indigo-500/25 sm:p-10\">\n      <div class=\"absolute -right-16 -top-16 h-56 w-56 rounded-full bg-white/10\"><\/div>\n      <div class=\"relative flex flex-wrap items-center justify-between gap-6\">\n        <div class=\"max-w-md\">\n          <h1 class=\"text-3xl font-extrabold sm:text-4xl\">${label}<\/h1>\n          <p class=\"mt-3 text-violet-100\">You answered <b>${r.correct} of ${r.total}<\/b> questions correctly${r.career ? ` while aiming for <b>${esc(r.career)}<\/b>` : ''}.<\/p>\n          ${r.goalReadiness !== null ? `<p class=\"mt-2 text-violet-100\">Readiness for your goal (key skills only): <b>${r.goalReadiness}%<\/b><\/p>` : ''}\n        <\/div>\n        <div class=\"relative grid h-36 w-36 place-items-center\" role=\"img\" aria-label=\"Overall score ${r.percent} percent\">\n          <svg viewBox=\"0 0 120 120\" class=\"h-36 w-36 -rotate-90\"><circle cx=\"60\" cy=\"60\" r=\"52\" fill=\"none\" stroke=\"rgba(255,255,255,.25)\" stroke-width=\"10\"/><circle id=\"ring\" cx=\"60\" cy=\"60\" r=\"52\" fill=\"none\" stroke=\"#fff\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-dasharray=\"${C}\" stroke-dashoffset=\"${C}\" style=\"transition:stroke-dashoffset 1s ease\"/><\/svg>\n          <div class=\"absolute text-center\"><b class=\"text-4xl\">${r.percent}%<\/b><p class=\"text-xs text-violet-100\">overall<\/p><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"card mt-6\">\n      <h2 class=\"ct mb-5\"><i data-i=\"chart\" data-s=\"20\"><\/i> Skill-wise performance<\/h2>\n      <div class=\"space-y-5\">\n        ${r.skills.map(k => `<div>\n          <div class=\"mb-1.5 flex flex-wrap items-center justify-between gap-2 text-sm\">\n            <span class=\"flex items-center gap-2 font-bold\">${esc(k.name)}${k.keySkill ? `<span class=\"inline-flex items-center gap-1 rounded-full bg-bs px-2 py-0.5 text-xs font-bold text-bp\">${icon('star', 12)} Key for your goal<\/span>` : ''}<\/span>\n            <span class=\"flex items-center gap-2\"><span class=\"text-slate-500\">${k.correct}/${k.total} correct \u00b7 ${k.percent}%<\/span><span class=\"rounded-full px-2.5 py-0.5 text-xs font-bold ${tag(k.percent)}\">${k.level}<\/span><\/span>\n          <\/div>\n          <div class=\"h-3 rounded-full bg-violet-100\"><div class=\"h-3 rounded-full bg-gradient-to-r ${col(k.percent)} transition-all duration-700\" data-w=\"${k.percent}\" style=\"width:0\"><\/div><\/div>\n        <\/div>`).join('')}\n      <\/div>\n    <\/div>\n\n    <div class=\"card mt-6\">\n      <h2 class=\"ct mb-3\"><i data-i=\"target\" data-s=\"20\"><\/i> Where to focus next<\/h2>\n      ${focus.length ? `<ul class=\"space-y-2 text-sm\">${focus.map(k => `<li class=\"flex items-center gap-3 rounded-xl bg-bs p-3\"><b>${esc(k.name)}<\/b><span class=\"text-slate-600\">${k.percent}% \u00b7 ${k.level.toLowerCase()}${k.keySkill ? ' \u00b7 important for your goal' : ''}<\/span><\/li>`).join('')}<\/ul>` : '<p class=\"text-sm text-slate-600\">Every skill area scored 80% or higher. Great work!<\/p>'}\n      <p class=\"mt-4 text-xs text-slate-500\">${saved ? 'These results are saved in this browser and will be used in the next Skill Analysis stage.' : 'Viewing a previously saved result.'}<\/p>\n    <\/div>\n\n    <div class=\"mt-6 flex flex-wrap gap-3\">\n      <button class=\"btn-p\" id=\"retakeBtn\">${icon('refresh', 18)} Retake Assessment<\/button>\n      <button class=\"btn-o\" id=\"reviewBtn\">${icon('list', 18)} Review answers<\/button>\n      <a class=\"btn-o\" href=\"profile.html\">${icon('user', 18)} Edit profile<\/a>\n      <a class=\"btn-o\" href=\"skillpath-ai-homepage.html\">Back to Home<\/a>\n    <\/div>\n    <div id=\"review\" class=\"mt-6 hidden space-y-4\"><\/div>\n  <\/div>`;\n\n  hydrate($('result'));\n  requestAnimationFrame(() => { // animate the ring and bars\n    $('ring').style.strokeDashoffset = C * (1 - r.percent / 100);\n    document.querySelectorAll('[data-w]').forEach(b => b.style.width = b.dataset.w + '%');\n  });\n\n  $('retakeBtn').onclick = () => $('startBtn').click();\n  $('reviewBtn').onclick = () => {\n    const box = $('review'); const open = box.classList.toggle('hidden') === false;\n    $('reviewBtn').lastChild.textContent = open ? ' Hide review' : ' Review answers';\n    if (open) box.innerHTML = r.answers.map(a => {\n      const q = QUESTIONS[a.index]; if (!q) return '';\n      const right = a.chosen === q.answer;\n      return `<article class=\"card !p-5\">\n        <p class=\"flex flex-wrap items-center gap-2 text-xs font-bold\"><span class=\"rounded-full bg-violet-100 px-2.5 py-0.5 text-bp\">${esc(q.skill)}<\/span><span class=\"rounded-full px-2.5 py-0.5 ${right ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}\">${a.chosen === null ? 'Not answered' : right ? 'Correct' : 'Incorrect'}<\/span><\/p>\n        <h3 class=\"mt-2 font-bold\">${a.index + 1}. ${esc(q.q)}<\/h3>\n        <ul class=\"mt-3 space-y-1.5 text-sm\">${q.options.map((o, i) => `<li class=\"flex items-center gap-2 rounded-lg px-3 py-2 ${i === q.answer ? 'bg-emerald-50 font-bold text-emerald-800' : i === a.chosen ? 'bg-red-50 text-red-800' :  return false; } }\n};\n\n/* Profile: same loading rule as profile.html (latest sp_users account, plus sp_profile if the email matches) */\nconst users = Store.read('sp_users', []);\nconst u = Array.isArray(users) && users.length ? users[users.length - 1] : null;\nconst reg = u ? { name: u.name || '', email: u.email || '', college: u.college || '', department: u.department || '', year: u.year || '' } : null;\nconst saved = Store.read('sp_profile', null);\nlet profile = { name:'', email:'', college:'', department:'', year:'', goal:'', skills:[] };\nif (saved && typeof saved === 'object' && (!reg || !saved.email || saved.email === reg.email)) {\n  profile = { ...profile, ...(reg || {}), ...saved };\n  if (reg) ['name','email','college','department','year'].forEach(k => { if (!profile[k]) profile[k] = reg[k]; });\n} else if (reg) profile = { ...profile, ...reg };\nif (!Array.isArray(profile.skills)) profile.skills = [];\nconst g = Store.raw('sp_career');                                  // plain text, as in profile.html\nconst goal = CAREERS[g] ? g : (CAREERS[profile.goal] ? profile.goal : '');\nconst hasProfile = !!(saved || reg);\n\n/* Assessment: sp_assessment = { student, career, percent, skills:[{ name, correct, total, percent, ... }], answers } */\nlet A = Store.read('sp_assessment', null);\nlet assessMismatch = false;\nif (A && !Array.isArray(A.skills)) A = null;\nif (A && A.student && A.student.email && profile.email && String(A.student.email).toLowerCase() !== String(profile.email).toLowerCase()) { A = null; assessMismatch = true; }\nconst amap = {}; (A ? A.skills : []).forEach(s => { if (s && s.name && s.total > 0) amap[s.name] = s; });\n\n/* Profile skills \u2192 canonical names (keep the highest level if several map to one skill) */\nconst pmap = {}, extras = [];\nconst rank = l => Object.keys(LVL_PTS).indexOf(l);\nprofile.skills.forEach(s => {\n  if (!s || !s.name) return;\n  const c = ALIAS[norm(s.name)];\n  if (!c) { extras.push(s.name); return; }\n  if alendar:'<rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M16 2v4M8 2v4M3 10h18\"/>',\n  check:'<path d=\"M20 6 9 17l-5-5\"/>',\n  alert:'<path d=\"M12 9v4M12 17h.01\"/><path d=\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"/>',\n  missing:'<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M8 12h8\"/>',\n  refresh:'<path d=\"M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5\"/>'\n};\nconst icon = (n, s, c = '') => `<svg class=\"${c}\" width=\"${s}\" height=\"${s}\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${P[n] || P.target}<\/svg>`;\nconst hydrate = r => r.querySelectorAll('i[data-i]').forEach(el => el.outerHTML = icon(el.dataset.i, el.dataset.s || 20, el.className));\nconst $ = id => document.getElementById(id);\nconst esc = s => String(s ?? '').replace(/[&<>\"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '\"':'&quot;', \"'\":'&#39;' }[c]));\nlet tt; function toast(m) { const t = $('toast'); t.textContent = m; t.style.opacity = 1; clearTimeout(tt); tt = setTimeout(() => t.style.opacity = 0, 3000); }\n\n/* ===== Careers (same six as the other pages) and the order skills are learned in ===== */\nconst CAREERS = { 'Software Developer':'code', 'Data Analyst':'chart', 'AI/ML Engineer':'chip', 'Cybersecurity Analyst':'shield', 'Web Developer':'globe', 'Full Stack Developer':'layers' };\n/* Prerequisites first: language basics before frameworks, concepts before tools, Git once there is code to save */\nconst ORDER = {\n  'Software Developer':    ['Python','JavaScript','SQL','Git & GitHub'],\n  'Data Analyst':          ['Data Basics','SQL','Python'],\n  'AI/ML Engineer':        ['Python','Data Basics','Git & GitHub'],\n  'Cybersecurity Analyst': ['Cybersecurity Basics','Python','Git & GitHub'],\n  'Web Developer':         ['HTML','CSS','JavaScript','Git & GitHub'],\n  'Full Stack Developer':  ['HTML','CSS','JavaScript','Git & GitHub','React.js','Node.js','SQL']\n};\n\n/* ===== Learning catalogue. m = skill is missing (start from basics), i = needs improvement (focused practice).\n   Each: [topic, practical exercise / mini-project, study hours, practice hours] ===== */\nconst CAT = {\n  'HTML': { course:'MDN: Learn HTML', url:'https://developer.mozilla.org/en-US/docs/Learn/HTML',\n    m:['Page structure, semantic tags, links, images and forms','Build a one-page personal profile with semantic tags and a contact form',4,4],\n    i:['Semantic elements, accessibility (alt text, labels) and form basics','Rewrite a page using header, nav, main and footer, and fix its accessibility gaps',2,3] },\n  'CSS': { course:'MDN: Learn CSS', url:'https://developer.mozilla.org/en-US/docs/Learn/CSS',\n    m:['Selectors, the box model, colors, typography and Flexbox basics','Style your profile page with a responsive Flexbox layout',5,4],\n    i:['Flexbox, Grid and responsive design with media queries','Recreate a three-card pricing layout that works on phone and desktop',3,3] },\n  'JavaScript': { course:'The Modern JavaScript Tutorial (javascript.info)', url:'https://javascript.info/',\n    m:['Variables, data types, functions, arrays and DOM basics','Build a to-do list that adds and removes items in the browser',6,5],\n    i:['Array methods, objects, async/await and fetch','Fetch data from a public API and show it in a searchable list',3,4] },\n  'Python': { course:'The Python Tutorial (python.org)', url:'https://docs.python.org/3/tutorial/',\n    m:['Syntax, variables, loops, functions, lists and dictionaries','Write a command-line expense tracker that stores items in a dictionary',6,5],\n    i:['Functions, file handling, modules and list comprehensions','Read a CSV file and print the total for each category',3,4] },\n  'SQL': { course:'SQLBolt interactive lessons', url:'https://sqlbolt.com/',\n    m:['SELECT, WHERE, ORDER BY, INSERT/UPDATE/DELETE and basic JOINs','Create a small students database acentHTML('beforeend', `<div class=\"rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800\">${html}<\/div>`);\nfunction empty(title, text, btnHref, btnText) {\n  $('empty').classList.remove('hidden');\n  $('empty').innerHTML = `<h2 class=\"ct mb-2\">${icon('target', 20)} ${title}<\/h2><p class=\"text-sm text-slate-600\">${text}<\/p><div class=\"mt-5 flex flex-wrap gap-3\"><a class=\"btn-p\" href=\"${btnHref}\">${btnText} ${icon('arrow', 18)}<\/a><\/div>`;\n}\nconst chk = (a, where, showSkill) => `<label class=\"flex cursor-pointer items-start gap-3 rounded-xl border-2 border-violet-100 bg-white p-3 text-sm transition hover:border-bp/50 has-[:checked]:border-bp has-[:checked]:bg-bs\">\n  <input type=\"checkbox\" class=\"peer mt-0.5 h-5 w-5 shrink-0 accent-[#7c3aed]\" data-id=\"${a.id}\" data-in=\"${where}\" ${prog.completed[a.id] ? 'checked' : ''}>\n  <span class=\"peer-checked:text-slate-500 peer-checked:line-through\">${showSkill ? `<b>${esc(a.skill)}<\/b> \u00b7 ` : ''}${esc(a.text)} <span class=\"whitespace-nowrap text-xs text-slate-500\">(${a.hours} h)<\/span><\/span><\/label>`;\nconst weeksFor = h => Math.max(1, Math.ceil(h / PACE));\nlet plan = null;\n\nfunction render() {\n  const done = plan.acts.filter(a => prog.completed[a.id]).length, total = plan.acts.length, pct = total ? Math.round(done / total * 100) : 0;\n\n  $('progCard').innerHTML = total\n    ? `<h2 class=\"ct mb-4\" id=\"h-prog\">${icon('check', 20)} Overall learning progress<\/h2>\n       <div class=\"mb-2 flex items-center justify-between text-sm font-bold\"><span>${done} of ${total} activities completed<\/span><span>${pct}%<\/span><\/div>\n       <div class=\"h-3 rounded-full bg-violet-100\" role=\"progressbar\" aria-label=\"Overall learning progress\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"${pct}\"><div class=\"h-3 rounded-full bg-gradient-to-r from-bb to-bp transition-all duration-500\" style=\"width:${pct}%\"><\/div><\/div>\n       <p class=\"mt class=\"text-bp underline\" href=\"${k.c.url}\" target=\"_blank\" rel=\"noopener noreferrer\">${esc(k.c.course)}<\/a><\/dd><\/div>\n        <div class=\"rounded-xl bg-bs p-3\"><dt class=\"text-xs font-bold text-slate-500\">Practical exercise<\/dt><dd class=\"mt-0.5 font-semibold\">${esc(k.project)}<\/dd><\/div>\n        <div class=\"rounded-xl bg-bs p-3\"><dt class=\"text-xs font-bold text-slate-500\">Estimated duration<\/dt><dd class=\"mt-0.5 font-semibold\">${k.hours} hours \u00b7 about ${weeksFor(k.hours)} week${weeksFor(k.hours) > 1 ? 's' : ''}<\/dd><\/div>\n      <\/dl>\n      <div class=\"mt-4 space-y-2\">${k.acts.map(a => chk(a, 'road', false)).join('')}<\/div><\/article>`;\n  }).join('') || '';\n  $('roadIntro').textContent = plan.skills.length ? `Follow these in order. Each skill builds on the ones before it for ${goal}.` + (plan.strong.length ? ` Skipped because they are already strong: ${plan.strong.join(', ')}.` : '') : '';\n\n  $('weekWrap').classList.toggle('hidden', !plan.weeks.length);\n  $('weekIntro').textContent = `Activities are packed in learning order into weeks of up to ${PACE} hours.`;\n  $('weeks').innerHTML = plan.weeks.map(w => {\n    const d = w.acts.filter(a => prog.completed[a.id]).length;\n    return `<section class=\"rounded-2xl border border-violet-100 bg-white p-4 shadow-sm shadow-indigo-500/5\" aria-label=\"Week ${w.n}\">\n      <h3 class=\"mb-3 flex items-center justify-between font-extrabold\"><span>Week ${w.n}<\/span><span class=\"text-xs font-bold text-slate-500\">${w.hours} h \u00b7 ${d}/${w.acts.length} done<\/span><\/h3>\n      <div class=\"space-y-2\">${w.acts.map(a => chk(a, 'week', true)).join('')}<\/div><\/section>`;\n  }).join('');\n  hydrate($('dash'));\n}\n\n/* Agent steps are built from the real saved data, so they change when the data changes */\nfunction agentSteps() {\n  const sk = SG.skills.length, mi = plan.missing, im = plan.skills.length - mi, st = plan.strong.length;\n  return [\n    `Read the saved skill gap m the basics (more hours). Skills that need work get focused practice (fewer hours).',\n    'Every recommended skill has two activities: study a course or tutorial, then practise with an exercise or mini-project.',\n    'Skills follow a fixed learning order for each career, with prerequisites first.',\n    `Weekly plans fill each week with up to ${PACE} hours, in learning order.`\n  ].map(t => `<li>${t}<\/li>`).join('');\n  $('dash').classList.remove('hidden');\n  render(); showSteps(false);\n}\n\n/* ===== Actions ===== */\nfunction saveProg() {\n  const done = plan.acts.filter(a => prog.completed[a.id]).length, total = plan.acts.length;\n  prog = { ...prog, updatedAt: new Date().toISOString(), studentEmail: profile.email || '', career: goal, done, total, percent: total ? Math.round(done / total * 100) : 0 };\n  const ok = Store.write('sp_learning_progress', prog);\n  lastSig = sig();\n  return ok;\n}\ndocument.addEventListener('change', e => {\n  const c = e.target.closest('input[data-id]'); if (!c || !plan) return;\n  const id = c.dataset.id, where = c.dataset.in;\n  if (c.checked) prog.completed[id] = new Date().toISOString(); else delete prog.completed[id];\n  const ok = saveProg();\n  render();\n  document.querySelector(`input[data-id=\"${id}\"][data-in=\"${where}\"]`)?.focus();\n  if (!ok) toast('Could not save progress: browser storage is blocked.');\n});\n$('replayBtn').onclick = () => showSteps(true);\n$('nextBtn').onclick = () => {\n  if (plan) saveProg();\n  toast('Progress saved. Opening your dashboard\u2026');\n  setTimeout(() => { SPNAV('dashboard.html'); }, 600);\n};\n\n/* Re-read everything when the data changes (another tab, or coming back from the skill gap page) */\nconst refresh = () => { if (sig() !== lastSig) paint(); };\nwindow.addEventListener('storage', refresh);\nwindow.addEventListener('focus', refresh);\nwindow.addEventListener('pageshow', refresh);\ndocument.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); }) => `<div class=\"h-3 rounded-full bg-violet-100\" role=\"progressbar\" aria-label=\"${esc(label)}\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"${p}\"><div class=\"h-3 rounded-full bg-gradient-to-r ${g || col(p)} transition-all duration-700\" style=\"width:${p}%\"><\/div><\/div>`;\nconst LV = { Beginner:'bg-blue-100 text-blue-700', Intermediate:'bg-violet-100 text-violet-700', Advanced:'bg-emerald-100 text-emerald-700' };\n\n/* ===== Navigation (same style as the other pages) ===== */\nconst NAV = [['Home','skillpath-ai-homepage.html'],['Profile','profile.html'],['Assessment','assessment.html'],['Skill Gap','skill-gap.html','Skill Gap Analysis'],['Learning','learning-recommendations.html','Learning Recommendations'],['Dashboard','dashboard.html'],['AI Mentor','ai-mentor.html']];\nconst navHtml = NAV.map(([t, h, full]) => h === 'dashboard.html'\n  ? `<li><a class=\"rounded-lg bg-bs px-3 py-1 text-bp\" href=\"${h}\" aria-current=\"page\">${t}<\/a><\/li>`\n  : `<li><a class=\"rounded-lg px-2 py-1 text-ink/80 transition hover:text-bp\" href=\"${h}\" title=\"${full || t}\">${t}<\/a><\/li>`).join('');\n$('navDesk').innerHTML = $('navMob').innerHTML = navHtml;\n\n/* ===== Same careers, learning order and plan sizes as learning-recommendations.html ===== */\nconst CAREERS = { 'Software Developer':'code', 'Data Analyst':'chart', 'AI/ML Engineer':'chip', 'Cybersecurity Analyst':'shield', 'Web Developer':'globe', 'Full Stack Developer':'layers' };\nconst ORDER = {\n  'Software Developer':    ['Python','JavaScript','SQL','Git & GitHub'],\n  'Data Analyst':          ['Data Basics','SQL','Python'],\n  'AI/ML Engineer':        ['Python','Data Basics','Git & GitHub'],\n  'Cybersecurity Analyst': ['Cybersecurity Basics','Python','Git & GitHub'],\n  'Web Developer':         ['HTML','CSS','JavaScript','Git & GitHub'],\n  'Full Stack Developer':  ['HTML','CSS','JavaScript','Git & GitHub','React.js','Node.js','SQL']\n};\n/* [study hours, practice hours] for a missing (m) or needs-improvement (i) skill */\nconst H = { 'HTML':{m:[4,4],i:[2,3]}, 'CSS':{m:[5,4],i:[3,3]}, 'JavaScript':{m:[6,5],i:[3,4]}, 'Python':{m:[6,5],i:[3,4]}, 'SQL':{m:[4,4],i:[2,3]},\n  'Git & GitHub':{m:[3,3],i:[2,2]}, 'Data Basics':{m:[5,4],i:[3,3]}, 'Cybersecurity Basics':{m:[5,3],i:[3,3]}, 'React.js':{m:[6,5],i:[3,4]}, 'Node.js':{m:[5,4],i:[3,4]} };\nconst CAPSTONE = { 'Full Stack Developer':'a full-stack mini-project (React front end, Node.js API and a SQL database)', 'Web Developer':'a multi-page responsive website mini-project', 'Software Developer':'a command-line app mini-project using Python and Git',\n  'Data Analyst':'a mini-project that analyses a public dataset with SQL and Python', 'AI/ML Engineer':'a small Python mini-project that analyses a dataset', 'Cybersecurity Analyst':'a security-checklist mini-project for a small web app' };\nconst KIND = { study:'Course or tutorial', exercise:'Practical exercise', project:'Mini-project' };   // a practice task of 4+ hours counts as a mini-project\n\n/* ===== Storage ===== */\nconst Store = {\n  read(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },\n  raw(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },\n  write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }\n};\nconst KEYS = ['sp_users','sp_profile','sp_career','sp_assessment','sp_skillgap','sp_learning_progress'];\nconst sig = () => KEYS.map(Store.raw).join('|');\nlet lastSig = '';\nconst ui = { cmp:false, all:false, open:{} };\n\n/* ===== Sample data (only used when there is no learner data at all) ===== */\nconst DS = ['HTML','CSS','JavaScript','Python','SQL','Git & GitHub','Data Basics','Cybersecurity Basics','React.js','Node.js'];\nconst DT = [3,3,3,3,3,2,2,2,3,3];\nfunction demoAttempt(arr, days) {\n  const skills = DS.map((n, i) => ({ name:n, correct:arr[i], total:DT[i], percent:Math.round(arr[i] / DT[i] * 100) }));\n  const correct = skills.reduce((s, k) => s + k.correct, 0), total = skills.reduce((s, k) => s + k.total, 0);\n  return { email:'', takenAt:new Date(Date.now() - days * 864e5).toISOString(), total, correct, percent:Math.round(correct / total * 100), skills, answers:[] };\n}\n\n/* ===== Load all data, keeping each student's records separate by email ===== */\nlet profile, goal, SG, A, hist, LPc, demo, ignored, plan, hasProfile, sgValid;\nfunction load() {\n  ignored = [];\n  const users = Store.read('sp_users', []);\n  const u = Array.isArray(users) && users.length ? users[users.length - 1] : null;\n  const reg = u ? { name:u.name || '', email:u.email || '', college:u.college || '', department:u.department || '', year:u.year || '' } : null;\n  const saved = Store.read('sp_profile', null);\n  profile = { name:'', email:'', college:'', department:'', year:'', goal:'', skills:[], certs:[], projects:[] };\n  if (saved && typeof saved === 'object' && (!reg || !saved.email || saved.email === reg.email)) {\n    profile = { ...profile, ...(reg || {}), ...saved };\n    if (reg) ['name','email','college','department','year'].forEach(k => { if (!profile[k]) profile[k] = reg[k]; });\n  } else if (reg) profile = { ...profile, ...reg };\n  ['skills','certs','projects'].forEach(k => { if (!Array.isArray(profile[k])) profile[k] = []; });\n  hasProfile = !!(saved || reg);\n  const g = Store.raw('sp_career');\n  goal = CAREERS[g] ? g : (CAREERS[profile.goal] ? profile.goal : '');\n  const em = (profile.email || '').toLowerCase();\n\n  SG = Store.read('sp_skillgap', null);\n  if (!(SG && Array.isArray(SG.skills) && SG.career)) SG = null;\n  if (SG && !same(SG.student && SG.student.email, em)) { SG = null; ignored.push('skill gap analysis'); }\n  let LP = Store.read('sp_learning_progress', null);\n  if (!(LP && LP.completed && typeof LP.completed === 'object')) LP = null;\n  if (LP && !same(LP.studentEmail, em)) { LP = null; ignored.push('learning progress'); }\n  A = Store.read('sp_assessment', null);\n  if (!(A && Array.isArray(A.skills))) A = null;\n  if (A && !same(A.student && A.student.email, em)) { A = null; ignored.push('assessment result'); }\n  LPc = LP ? { ...LP.completed } : {};\n\n  demo = !SG && !A && !Object.keys(LPc).length;\n  if (demo) {\n    if (!hasProfile) profile = { ...profile, name:'Demo Student', college:'Demo College', department:'Computer Science', year:'3rd Year', skills:[{name:'HTML',level:'Intermediate'},{name:'CSS',level:'Intermediate'},{name:'JavaScript',level:'Beginner'}] };\n    goal = goal || 'Full Stack Developer';\n    const sk = ORDER[goal].map((n, i) => ({ name:n, status:i === 0 ? 'strong' : i === 1 ? 'improve' : 'missing', score:[85,55,30,20,15,10,10][i] ?? 10, assessmentPercent:null, profileLevel:null }));\n    SG = { career:goal, readiness:Math.round(sk.reduce((s, k) => s + k.score, 0) / sk.length), skills:sk };\n    const prev = demoAttempt([2,1,1,1,1,1,0,1,0,0], 9);\n    A = demoAttempt([3,2,2,2,2,1,1,1,1,0], 2); hist = [prev, A];\n  } else if (A) {\n    /* sp_assessment only holds the latest attempt, so each new attempt is also saved to a history list */\n    const all = Store.read('sp_assessment_history', []), list = Array.isArray(all) ? all : [];\n    if (!list.some(h => h.email === em && h.takenAt === A.takenAt)) {\n      list.push({ email:em, takenAt:A.takenAt, total:A.total, correct:A.correct, percent:A.percent, skills:A.skills.map(s => ({ name:s.name, correct:s.correct, total:s.total, percent:s.percent })) });\n      const mine = list.filter(h => h.email === em).slice(-20);\n      Store.write('sp_assessment_history', [...list.filter(h => h.email !== em), ...mine]);\n    }\n    hist = Store.read('sp_assessment_history', []).filter(h => h.email === em);\n  } else hist = [];\n  hist.sort((a, b) => ts(a.takenAt) - ts(b.takenAt));\n\n  /* Learning plan: same rules as learning-recommendations.html */\n  sgValid = !!SG && SG.career === goal;\n  plan = null;\n  if (sgValid) {\n    const by = {}; S SG.createdAt)) n += note(`Your latest assessment is newer than your saved skill gap analysis. ${lnk('skill-gap.html', 'Open skill gap')} to refresh it.`);\n  if (!goal) n += note(`You haven\u2019t chosen a career goal yet. ${lnk('profile.html', 'Choose one in your profile')}.`);\n  $('notices').innerHTML = n;\n\n  /* 1. Overview */\n  $('stats').innerHTML = stat('Learning completion', pct + '%', `${done} of ${total} activities`) + stat('Completed activities', done, 'courses, exercises and projects') + stat('Remaining activities', Math.max(total - done, 0), total ? 'still to do' : 'no plan yet') + stat('Career readiness', ready === null ? '\u2013' : ready + '%', ready === null ? 'run the skill gap analysis' : 'from your skill gap analysis');\n  $('info').innerHTML = `<h2 class=\"ct mb-4\" id=\"h-info\">${icon('user', 20)} Student profile ${tag()}<\/h2>\n    <dl class=\"grid gap-3 text-sm sm:grid-cols-2 lg:grid-cols-4\">${[['Email', profile.email], ['College', profile.college], ['Department', profile.department], ['Year of study', profile.year]].map(([l, v]) => `<div class=\"rounded-xl bg-bs p-3\"><dt class=\"text-xs font-bold text-slate-500\">${l}<\/dt><dd class=\"mt-0.5 break-words font-semibold\">${v ? esc(v) : '<span class=\"font-normal text-slate-400\">Not added<\/span>'}<\/dd><\/div>`).join('')}<\/dl>\n    <div class=\"mt-4 flex flex-wrap items-center gap-2 text-sm\">${profile.skills.length ? profile.skills.map(s => `<span class=\"rounded-full border border-violet-100 bg-bs py-1 pl-3 pr-1.5 font-semibold\">${esc(s.name)} <span class=\"ml-1 rounded-full px-2 py-0.5 text-xs font-bold ${LV[s.level] || LV.Beginner}\">${esc(s.level)}<\/span><\/span>`).join('') : '<span class=\"text-slate-500\">No skills added to your profile yet.<\/span>'}<\/div>\n    <p class=\"mt-3 text-xs text-slate-500\">${profile.certs.length} certification${profile.certs.length === 1 ? '' : 's'} \u00b7 ${profile.projects.length} project${profile.projects.length === 1 ? '' : 's'} \u00b7 <a class=\"font-bold text-bp hover:underline\" href=\"profile.html\">Edit profile<\/a><\/p>`;\n\n  /* 2. Learning progress */\n  let L = `<h2 class=\"ct mb-4\" id=\"h-learn\">${icon('check', 20)} Learning progress ${tag()}<\/h2>`;\n  if (sgValid) { const g = (t, k, c) => { const l = SG.skills.filter(x => x.status === k).map(x => x.name); return `<span class=\"mr-1 text-xs font-bold text-slate-500\">${t}:<\/span>${l.length ? l.map(x => `<span class=\"mr-1 rounded-full px-2.5 py-0.5 text-xs font-bold ${c}\">${esc(x)}<\/span>`).join('') : '<span class=\"mr-2 text-xs text-slate-400\">none<\/span>'}`; };\n    L += `<div class=\"mb-5 rounded-xl bg-bs p-3 text-sm\"><p class=\"mb-1 font-extrabold\">Skill gaps for ${esc(goal)}<\/p><p class=\"flex flex-wrap items-center gap-y-1\">${g('Missing', 'missing', 'bg-red-100 text-red-700')}${g('Needs work', 'improve', 'bg-amber-100 text-amber-700')}${g('Strong', 'strong', 'bg-emerald-100 text-emerald-700')}<\/p><\/div>`; }\n  if (!sgValid) L += msg('Your learning progress appears here once a skill gap analysis for your current goal is saved.', 'skill-gap.html', 'Open skill gap analysis');\n  else if (!plan.skills.length) L += msg(`Every skill required for ${esc(goal)} is already strong, so there is no learning plan to track.`);\n  else {\n    const types = ['study', 'exercise', 'project'].map(k => { const all = plan.acts.filter(a => a.kind === k), d = all.filter(a => LPc[a.id]).length; return { k, d, t:all.length, p:all.length ? Math.round(d / all.length * 100) : 0 }; });\n    L += `<div class=\"space-y-4\">${types.filter(t => t.t).map(t => `<div><div class=\"mb-1.5 flex justify-between text-sm\"><b>${t.k === 'study' ? 'Courses and tutorials' : t.k === 'exercise' ? 'Practical exercises' : 'Mini-projects'}<\/b><span class=\"text-slate-500\">${t.d} of ${t.t} completed<\/span><\/div>${bar(t.p, '', KIND[t.k])}<\/div>`).join('')}<\/div>`;\n    const grp = (title, list, cls) => `<div class=\"rounded-xl bg-bs p-3\"><p class=\"text-xs font-bold text d]) : 'Not done yet'}<\/span><\/li>`).join('')}<\/ul>` : ''}<\/div>`;\n    }).join('')}<\/div>`;\n  }\n  $('learn').innerHTML = L + `<div class=\"mt-5\"><a class=\"btn-p\" href=\"learning-recommendations.html\">Continue learning ${icon('arrow', 18)}<\/a><\/div>`;\n\n  /* 3. Assessment performance */\n  const prev = hist.length > 1 ? hist[hist.length - 2] : null, first = hist.length > 1 ? hist[0] : null;\n  const dl = d => d > 0 ? `<span class=\"font-bold text-emerald-600\">\u25b2 +${d}<\/span>` : d < 0 ? `<span class=\"font-bold text-red-600\">\u25bc ${d}<\/span>` : '<span class=\"font-bold text-slate-500\">\u2013 0<\/span>';\n  let S = `<h2 class=\"ct mb-4\" id=\"h-assess\">${icon('chart', 20)} Assessment performance ${tag()}<\/h2>`;\n  if (!A) S += msg('No assessment result yet. Take the assessment to see your scores here.', 'assessment.html', 'Take the assessment');\n  else {\n    const wrong = A.total - A.correct, un = Array.isArray(A.answers) ? A.answers.filter(a => a.chosen === null).length : 0, cp = A.total ? Math.round(A.correct / A.total * 100) : 0;\n    S += `<div class=\"grid gap-3 sm:grid-cols-3\"><div class=\"rounded-xl bg-bs p-3\"><p class=\"text-xs font-bold text-slate-500\">Latest score<\/p><p class=\"text-2xl font-extrabold\">${A.percent}%<\/p><p class=\"text-xs text-slate-500\">${fmt(A.takenAt)}<\/p><\/div>\n      <div class=\"rounded-xl bg-bs p-3\"><p class=\"text-xs font-bold text-slate-500\">Correct / incorrect<\/p><p class=\"text-2xl font-extrabold\"><span class=\"text-emerald-600\">${A.correct}<\/span> / <span class=\"text-red-600\">${wrong}<\/span><\/p><p class=\"text-xs text-slate-500\">${un ? un + ' unanswered counted as incorrect' : 'of ' + A.total + ' questions'}<\/p><\/div>\n      <div class=\"rounded-xl bg-bs p-3\"><p class=\"text-xs font-bold text-slate-500\">Improvement<\/p><p class=\"text-2xl font-extrabold\">${prev ? dl(A.percent - prev.percent) : '\u2013'}<\/p><p class=\"text-xs text-slate-500\">${prev ? `since previous attempt${fi gin, padding and display settings.',\n    m:['Selectors, the box model, colors, typography and Flexbox basics','Style your profile page with a responsive Flexbox layout',5,4], i:['Flexbox, Grid and responsive design with media queries','Recreate a three-card pricing layout that works on phone and desktop',3,3] },\n  'JavaScript': { course:'The Modern JavaScript Tutorial (javascript.info)', url:'https://javascript.info/', what:'JavaScript makes pages interactive, and it also runs on servers through Node.js.', tip:'Practise array methods (map, filter) and read the browser console error messages carefully.',\n    m:['Variables, data types, functions, arrays and DOM basics','Build a to-do list that adds and removes items in the browser',6,5], i:['Array methods, objects, async/await and fetch','Fetch data from a public API and show it in a searchable list',3,4] },\n  'Python': { course:'The Python Tutorial (python.org)', url:'https://docs.python.org/3/tutorial/', what:'Python is a beginner-friendly language used for scripting, data analysis and AI.', tip:'Type out small programs every day and get comfortable with lists and dictionaries.',\n    m:['Syntax, variables, loops, functions, lists and dictionaries','Write a command-line expense tracker that stores items in a dictionary',6,5], i:['Functions, file handling, modules and list comprehensions','Read a CSV file and print the total for each category',3,4] },\n  'SQL': { course:'SQLBolt interactive lessons', url:'https://sqlbolt.com/', what:'SQL is the language for asking questions of data stored in tables.', tip:'Sketch the tables on paper, then build queries step by step: SELECT, then WHERE, then JOIN.',\n    m:['SELECT, WHERE, ORDER BY, INSERT/UPDATE/DELETE and basic JOINs','Create a small students database and answer 10 questions with queries',4,4], i:['JOIN types, GROUP BY with aggregates and subqueries','Write 8 queries across two related tables using JOIN and GROUP BY',2,3] },\n  'Git & GitHub': { course:'GitHub Skills', url:'https://skills.github.com/', what:'Git tracks changes to your code, and GitHub hosts repositories so you can share and collaborate.', tip:'Commit small and often with clear messages, and use a branch for each new feature.',\n    m:['git init, add, commit, branches, push and pull requests','Put one of your projects on GitHub and open a pull request from a feature branch',3,3], i:['Branching, merging, resolving conflicts and reviewing pull requests','Create a deliberate merge conflict in a practice repository and resolve it',2,2] },\n  'Data Basics': { course:'Khan Academy: Statistics and probability', url:'https://www.khanacademy.org/math/statistics-probability', what:'Data basics cover averages, spread and choosing a chart that fits the question.', tip:'Before drawing a chart, ask which question it should answer.',\n    m:['Mean, median, mode, reading tables and choosing the right chart','Compute averages for a small dataset and draw a bar chart and a line chart in a spreadsheet',5,4], i:['Spread, outliers and picking the right chart for a question','Find outliers in a dataset and explain how they change the average',3,3] },\n  'Cybersecurity Basics': { course:'TryHackMe: Pre Security learning path', url:'https://tryhackme.com/path/outline/presecurity', what:'Cybersecurity basics cover keeping accounts, data and websites safe from common attacks.', tip:'Learn how HTTPS, strong passwords and input validation each stop a different kind of attack.',\n    m:['How the web works, HTTP vs HTTPS, passwords and common threats such as phishing','Review your own accounts: turn on two-step sign-in and write a one-page password policy',5,3], i:['OWASP Top 10 risks, encryption basics and safe sign-in','Pick 3 OWASP Top 10 items and write how each could affect a login page',3,3] },\n  'React.js': { course:'React documentation: Learn React', url:'https://react.dev/learn', what:'React is a JavaScript library for building user interfaces from reusable components.', tip:'
