 hover:bg-indigo-600 hover:text-white'; out.onclick = SP.logout;\n      if (av) right.append(av); right.append(out);\n      const d = document.createElement('ul'); d.id = 'navDesk'; d.className = 'hidden items-center gap-3 text-sm font-semibold lg:flex'; d.innerHTML = NAV.map(li).join('');\n      const m = document.createElement('ul'); m.id = 'navMob'; m.className = 'flex gap-1 overflow-x-auto whitespace-nowrap pb-2 text-sm font-semibold lg:hidden'; m.innerHTML = NAV.map(li).join('');\n      if (logo) { const sp = logo.querySelector('span.hidden'); if (sp) sp.className = 'hidden xl:inline'; row.append(logo); }\n      row.append(d, right); nav.append(row, m);\n      if (main && !['ai-mentor.html','learning-recommendations.html','multi-agent.html'].includes(page))\n        main.insertAdjacentHTML('afterbegin', strip('<b>Rule-based simulation.<\/b> Scores, gaps and suggestions come from fixed rules running in your browser. No real AI model or online service is connected.', 'border-violet-200 bg-violet-50 text-violet-800'));\n    } else if (page === 'skillpath-ai-homepage.html' && s) {\n      document.querySelectorAll('a[href=\"login.html\"]').forEach(a => { a.textContent = 'Dashboard'; a.href = 'dashboard.html'; });\n      document.querySelectorAll('a[href=\"register.html\"]').forEach(a => {\n        if (a.closest('header')) { a.textContent = 'Logout'; a.href = '#'; a.addEventListener('click', e => { e.preventDefault(); SP.logout(); }); }\n        else a.href = 'dashboard.html';\n      });\n    }\n    document.querySelectorAll('[data-soon]').forEach(a => a.removeAttribute('data-soon'));\n  });\n})();\n<\/script>\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n<script src=\"https://cdn.tailwindcss.com/3.4.17\"><\/script>\n<script>\ntailwind.config = { theme: { extend: {\n  fontFamily: { sans: ['\"Plus Jakarta Sans\"', 'system-ui', 'sans-serif'] },\n  colors: { ink: '#1e1b4b', bb: '#2563eb', bp: '#7c3aed', bs: '#f5f3ff' },\n  keyframes: { up: { from: { opacity: 0, transform: 'translateY(16px)' }, to: { opacity: 1, transform: 'none' } } },\n  animation: { up: 'up .5s ease-out both' }\n} } }\n<\/script>\n<style type=\"text/tailwindcss\">\n  body{@apply font-sans text-ink antialiased}\n  a:focus-visible,button:focus-visible{@apply outline outline-2 outline-offset-2 outline-bp}\n  .btn{@apply inline-flex items-center justify-center gap-2 rounded-xl px-5 py-2.5 font-bold transition hover:-translate-y-0.5 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:translate-y-0}\n  .btn-p{@apply btn bg-gradient-to-r from-bb to-bp text-white shadow-lg shadow-indigo-500/25 hover:shadow-xl}\n  .btn-o{@apply btn border-2 border-indigo-600 bg-white text-indigo-600 hover:bg-indigo-600 hover:text-white}\n  .btn-s{@apply !px-3 !py-1.5 text-sm}\n  .gt{@apply bg-gradient-to-r from-bb to-bp bg-clip-text text-transparent}\n  .ib{@apply grid place-items-center bg-gradient-to-br from-bb to-bp text-white}\n  .card{@apply rounded-2xl border border-violet-100 bg-white p-6 shadow-sm shadow-indigo-500/5 sm:p-8}\n  .ct{@apply flex flex-wrap items-center gap-2 text-lg font-extrabold}\n  .ct svg{@apply text-bp}\n  .pill{@apply inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-bold}\n  .spin{animation:spin 1s linear infinite}\n  @keyframes spin{to{transform:rotate(360deg)}}\n  @media (prefers-reduced-motion:reduce){.animate-up,.spin{animation:none!important}}\n  @media print{header,.noprint,#agents,#detailSec,#flow{display:none!important}main{padding-top:0!important}}\n<\/style>\n<\/head>\n<body style=\"background:#faf9ff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)\">\n\n<header class=\"fixed inset-x-0 top-0 z-40 border-b border-violet-100 bg-white/90 backdrop-blur\" style=\"padding-top:env(safe-area-inset-top,0px)\">\n  <nav class=\"mx-auto max-w-6xl px-4 sm:px-6\" aria-label=\"Main\">\n    <div class=\"flex h-16 items-center justify-between gap-3\">\n      <a href=\"skillpath-ai-homepage.html\" class=\"flex items-center gap-2 text-xl font-extrabold\"><span class=\"ib h-10 w-10 rounded-xl shadow-md\" id=\"logo\"><\/span><span>SkillPath <span class=\"gt\">AI<\/span><\/span><\/a>\n      <ul class=\"hidden items-center gap-3 text-sm font-semibold xl:flex\" id=\"navDesk\"><\/ul>\n    <\/div>\n    <ul class=\"flex gap-1 overflow-x-auto whitespace-nowrap pb-2 text-sm font-semibold xl:hidden\" id=\"navMob\"><\/ul>\n  <\/nav>\n<\/header>\n\n<main class=\"mx-auto max-w-6xl px-4 pb-14 pt-32 sm:px-6 lg:pt-28\">\n  <section class=\"animate-up relative overflow-hidden rounded-3xl bg-gradient-to-br from-bb via-indigo-600 to-bp p-7 text-white shadow-2xl shadow-indigo-500/25 sm:p-10\">\n    <div class=\"absolute -right-16 -top-16 h-56 w-56 rounded-full bg-white/10\"><\/div>\n    <div class=\"relative flex flex-wrap items-end justify-between gap-6\">\n      <div class=\"max-w-2xl\">\n        <p class=\"text-sm font-semibold text-violet-100\">Step 9 \u00b7 Multi-Agent Collaboration<\/p>\n        <h1 class=\"mt-1 text-3xl font-extrabold sm:text-4xl\">Six agents, one personalized report<\/h1>\n        <p class=\"mt-2 text-violet-100\">Six rule-based agents (JavaScript) read your saved SkillPath data, hand their findings to each other, and the Coordinator combines everything. No external AI service is connected.<\/p>\n        <p class=\"mt-3 text-sm text-violet-100\" id=\"updated\" aria-live=\"polite\"><\/p>\n      <\/div>\n      <div class=\"flex flex-wrap gap-3 noprint\">\n        <button class=\"btn bg-white text-indigo-700 shadow-lg\" id=\"runAll\"><\/button>\n        <button class=\"btn border-2 border-white/60 text-white hover:bg-white/10\" id=\"resetBtn\">Clear agent results<\/button>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <div id=\"banner\" class=\"mt-6\"><\/div>\n\n  <section class=\"mt-6\" id=\"flow\" aria-label=\"Agent workflow\"><div class=\"card !p-5 sm:!p-6\"><h2 class=\"ct mb-4\" id=\"flowT\"><\/h2><ol class=\"grid grid-cols-6 gap-0\" id=\"stepper\"><\/ol><p class=\"mt-4 text-sm text-slate-500\" id=\"runMsg\" role=\"status\" aria-live=\"polite\">Agents run in order. Each one passes its findings to the next.<\/p><\/div><\/section>\n\n  <section class=\"mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-3\" id=\"agents\" aria-label=\"Agents\"><\/section>\n\n  <section class=\"mt-6\" id=\"detailSec\" aria-label=\"Detailed analysis\">\n    <div class=\"card\"><h2 class=\"ct\" id=\"detailT\"><\/h2>\n      <div class=\"mt-4 flex gap-2 overflow-x-auto pb-1\" id=\"detailTabs\" role=\"tablist\"><\/div>\n      <div class=\"mt-5\" id=\"detail\" role=\"tabpanel\"><\/div><\/div>\n  <\/section>\n\n  <section class=\"mt-6\" id=\"report\" aria-label=\"Final student report\"><\/section>\n<\/main>\n\n<footer class=\"border-t border-violet-100 bg-white py-6 text-center text-sm text-slate-500\">\u00a9 2026 SkillPath AI \u00b7 Rule-based prototype \u00b7 <a class=\"font-semibold text-bp hover:underline\" href=\"skillpath-ai-homepage.html\">Back to Home<\/a><\/footer>\n<div id=\"toast\" class=\"pointer-events-none fixed bottom-6 left-1/2 z-50 w-max max-w-[90vw] -translate-x-1/2 rounded-xl bg-ink px-5 py-3 text-center text-sm font-semibold text-white opacity-0 shadow-xl transition\" role=\"status\"><\/div>\n\n<script>\n/* =====================================================================\n   SkillPath AI \u2013 Multi-Agent Collaboration (rule-based prototype)\n   Sections: 1 Helpers \u00b7 2 Reference data \u00b7 3 Data loading \u00b7 4 Agents\n             5 Results storage \u00b7 6 Rendering \u00b7 7 Controller\n   ===================================================================== */\n\n/* ---------- 1. Helpers ---------- */\nconst P = {\n  route:'<circle cx=\"6\" cy=\"19\" r=\"3\"/><path d=\"M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15\"/><circle cx=\"18\" cy=\"5\" r=\"3\"/>',\n  user:'<circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21a8 8 0 0 1 16 0\"/>',\n  chart:'<path d=\"M3 3v18h18M7 16v-5M12 16V7M17 16v-3\"/>',\n  target:'<circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/>',\n  activity:'<path d=\"M22 12h-4l-3 9L9 3l-3 9H2\"/>',\n  layers:'<path d=\"m12 2 10 5-10 5L2 7zM2 17l10 5 10-5M2 12l10 5 10-5\"/>',\n  check:'<path d=\"M20 6 9 17l-5-5\"/>', play:'<path d=\"m6 4 14 8-14 8z\"/>',\n  alert:'<path d=\"M12 9v4M12 17h.01\"/><path d=\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"/>',\n  refresh:'<path d=\"M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5\"/>', arrow:'<path d=\"M5 12h14M12 5l7 7-7 7\"/>',\n  loader:'<path d=\"M21 12a9 9 0 1 1-6.2-8.6\"/>', print:'<path d=\"M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z\"/>'\n};\nconst icon = (n, s = 20, c = '') => `<svg class=\"${c}\" width=\"${s}\" height=\"${s}\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">${P[n] || P.target}<\/svg>`;\nconst $ = id => document.getElementById(id);\nconst esc = s => String(s ?? '').replace(/[&<>\"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '\"':'&quot;', \"'\":'&#39;' }[c]));\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\nconst same = (a, b) => !a || !b || String(a).toLowerCase() === String(b).toLowerCase();\nconst slug = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');\nconst fmt = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString([], { dateStyle:'medium', timeStyle:'short' }); };\nlet tt; function toast(m) { const t = $('toast'); t.textContent = m; t.style.opacity = 1; clearTimeout(tt); tt = setTimeout(() => t.style.opacity = 0, 3200); }\nconst Store = {\n  read(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },\n  raw(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },\n  write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },\n  remove(k) { try { localStorage.removeItem(k); } catch (e) {} }\n};\nconst SOURCE_KEYS = ['sp_users','sp_profile','sp_career','sp_assessment','sp_skillgap','sp_learning_progress','sp_assessment_history'];   // read-only for this page\nconst RESULT_KEY = 'sp_agent_results';                                                                                        // the only key this page writes\n\n/* ---------- 2. Reference data (same careers, order and plan sizes as the existing pages) ---------- */\nconst CAREERS = ['Software Developer','Data Analyst','AI/ML Engineer','Cybersecurity Analyst','Web Developer','Full Stack Developer'];\nconst ORDER = {\n  'Software Developer':['Python','JavaScript','SQL','Git & GitHub'], 'Data Analyst':['Data Basics','SQL','Python'],\n  'AI/ML Engineer':['Python','Data Basics','Git & GitHub'], 'Cybersecurity Analyst':['Cybersecurity Basics','Python','Git & GitHub'],\n  'Web Developer':['HTML','CSS','JavaScript','Git & GitHub'], 'Full Stack Developer':['HTML','CSS','JavaScript','Git & GitHub','React.js','Node.js','SQL']\n};\nconst ALL_SKILLS = [...new Set(Object.values(ORDER).flat())];\n/* [course, url, \"missing\" exercise, \"improve\" exercise, [study,practice] hours when missing, [study,practice] hours when improving] */\nconst CAT = {\n  'HTML':['MDN: Learn HTML','https://developer.mozilla.org/en-US/docs/Learn/HTML','Build a one-page personal profile with semantic tags and a contact form','Rewrite a page using header, nav, main and footer, and fix its accessibility gaps',[4,4],[2,3]],\n  'CSS':['MDN: Learn CSS','https://developer.mozilla.org/en-US/docs/Learn/CSS','Style your profile page with a responsive Flexbox layout','Recreate a three-card pricing layout that works on phone and desktop',[5,4],[3,3]],\n  'JavaScript':['The Modern JavaScript Tutorial','https://javascript.info/','Build a to-do list that adds and removes items in the browser','Fetch data from a public API and show it in a searchable list',[6,5],[3,4]],\n  'Python':['The Python Tutorial (python.org)','https://docs.python.org/3/tutorial/','Write a command-line expense tracker that stores items in a dictionary','Read a CSV file and print the total for each category',[6,5],[3,4]],\n  'SQL':['SQLBolt interactive lessons','https://sqlbolt.com/','Create a small students database and answer 10 questions with queries','Write 8 queries across two related tables using JOIN and GROUP BY',[4,4],[2,3]],\n  'Git & GitHub':['GitHub Skills','https://skills.github.com/','Put one of your projects on GitHub and open a pull request from a feature branch','Create a deliberate merge conflict in a practice repository and resolve it',[3,3],[2,2]],\n  'Data Basics':['Khan Academy: Statistics and probability','https://www.khanacademy.org/math/statistics-probability','Compute averages for a small dataset and draw a bar chart and a line chart','Find outliers in a dataset and explain how they change the average',[5,4],[3,3]],\n  'Cybersecurity Basics':['TryHackMe: Pre Security path','https://tryhackme.com/path/outline/presecurity','Review your own accounts: turn on two-step sign-in and write a one-page password policy','Pick 3 OWASP Top 10 items and write how each could affect a login page',[5,3],[3,3]],\n  'React.js':['React documentation: Learn React','https://react.dev/learn','Build a counter and a to-do list as React components','Build a component that fetches a list from a public API and filters it',[6,5],[3,4]],\n  'Node.js':['Node.js official learning guides','https://nodejs.org/en/learn','Create a small server with two routes that return JSON','Build a JSON notes API that supports GET and POST',[5,4],[3,4]]\n};\nconst CAPSTONE = { 'Full Stack Developer':'a full-stack mini-project (React front end, Node.js API and a SQL database)', 'Web Developer':'a multi-page responsive website', 'Software Developer':'a command-line app using Python and Git',\n  'Data Analyst':'a mini-project that analyses a public dataset with SQL and Python', 'AI/ML Engineer':'a small Python project that analyses a dataset', 'Cybersecurity Analyst':'a security checklist for a small web app' };\nconst LEVEL = { Beginner:35, Intermediate:65, Advanced:90 };\nconst PACE = 8;   // study + practice hours per week\nconst band = s => s >= 70 ? 'strong' : s >= 40 ? 'improve' : 'missing';\nconst STATUS_LABEL = { strong:'Strong', improve:'Needs improvement', missing:'Missing', unknown:'Not assessed' };\nconst STATUS_CLS = { strong:'bg-emerald-100 text-emerald-700', improve:'bg-amber-100 text-amber-700', missing:'bg-rose-100 text-rose-700', unknown:'bg-slate-100 text-slate-600' };\nconst key = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');\nfunction canon(n) {   // map free-text profile skills (e.g. \"react\", \"Github\") to the skills used on the other pages\n  const k = key(n);\n  const hit = ALL_SKILLS.find(a => key(a) === k) || ALL_SKILLS.find(a => { const b = key(a).replace(/js$/, ''); return b.length > 2 && (k === b || k === b + 'js'); });\n  return hit || (k.startsWith('git') ? 'Git & GitHub' : k.startsWith('cyber') ? 'Cybersecurity Basics' : null);\n}\n\n/* ---------- 3. Data loading (read-only; every student's records are matched by email) ---------- */\nfunction load() {\n  const users = Store.read('sp_users', []), u = Array.isArray(users) && users.length ? users[users.length - 1] : null;\n  const saved = Store.read('sp_profile', null);\n  let profile = { name:'', email:'', college:'', department:'', year:'', goal:'', skills:[], certs:[], projects:[] };\n  const reg = u ? { name:u.name || '', email:u.email || '', college:u.college || '', department:u.department || '', year:u.year || '' } : null;\n  if (saved && typeof saved === 'object' && (!reg || !saved.email || same(saved.email, reg.email))) {\n    profile = { ...profile, ...saved };\n    if (reg) ['name','email','college','department','year'].forEach(k => { if (!profile[k]) profile[k] = reg[k]; });\n  } else if (reg) profile = { ...profile, ...reg };\n  ['skills','certs','projects'].forEach(k => { if (!Array.isArray(profile[k])) profile[k] = []; });\n  const hasProfile = !!(saved || reg), em = (profile.email || '').toLowerCase(), ignored = [];\n\n  let rawGoal = Store.raw('sp_career'); try { const v = JSON.parse(rawGoal); if (typeof v === 'string') rawGoal = v; } catch (e) {}\n  const goal = CAREERS.includes(rawGoal) ? rawGoal : (CAREERS.includes(profile.goal) ? profile.goal : '');\n\n  let SG = Store.read('sp_skillgap', null);\n  if (!(SG && Array.isArray(SG.skills) && SG.career)) SG = null;\n  if (SG && !same(SG.student && SG.student.email, em)) { SG = null; ignored.push('skill-gap result'); }\n  let A = Store.read('sp_assessment', null);\n  if (!(A && Array.isArray(A.skills))) A = null;\n  if (A && !same(A.student && A.student.email, em)) { A = null; ignored.push('assessment result'); }\n  let LP = Store.read('sp_learning_progress', null);\n  if (!(LP && LP.completed && typeof LP.completed === 'object')) LP = null;\n  if (LP && !same(LP.studentEmail, em)) { LP = null; ignored.push('learning progress'); }\n\n  const rawH = Store.read('sp_assessment_history', []);\n  const hist = (Array.isArray(rawH) ? rawH : []).filter(h => h && h.email === em && Array.isArray(h.skills)).map(h => ({ takenAt:h.takenAt, percent:h.percent, skills:h.skills }));\n  if (A && !hist.some(h => h.takenAt === A.takenAt)) hist.push({ takenAt:A.takenAt, percent:A.percent, skills:A.skills });\n  hist.sort((a, b) => new Date(a.takenAt) - new Date(b.takenAt));\n\n  /* evidence(name) \u2192 best available score for a skill: skill-gap result, else assessment, else the learner's self-rated profile level */\n  const sg = {}, as = {}, pr = {};\n  if (SG) SG.skills.forEach(s => s && s.name && (sg[s.name] = s));\n  if (A) A.skills.forEach(s => s && s.name && (as[s.name] = s));\n  profile.skills.forEach(s => { const c = canon(s.name || ''); if (c) pr[c] = s; });\n  const ev = n => {\n    if (sg[n] && typeof sg[n].score === 'number') return { score:sg[n].score, status:sg[n].status || band(sg[n].score), source:'skill-gap analysis' };\n    if (as[n] && typeof as[n].percent === 'number') return { score:as[n].percent, status:band(as[n].percent), source:'assessment' };\n    if (pr[n]) { const sc = LEVEL[pr[n].level] ?? 35; return { score:sc, status:band(sc), source:'profile (self-rated ' + (pr[n].level || 'Beginner') + ')' }; }\n    return null;\n  };\n  const sig = SOURCE_KEYS.map(Store.raw).join('|');\n  return { profile, hasProfile, hasUser:!!u, goal, SG, A, LP, hist, ev, ignored, sig, email:em };\n}\n\n/* ---------- 4. The six agents ----------\n   Contract (this is where a real AI API could be plugged in later):\n     run(D, R) \u2192 { summary:'one-line main result', result:{...JSON-safe findings...} }\n     D = learner data from localStorage, R = results of the agents that ran before (R[1]..R[5]).\n   Each agent only reads D and R. None of them writes to existing storage keys. */\nconst AGENTS = [\n{ id:1, name:'Profile Analysis Agent', purpose:'Summarizes who the learner is and finds missing profile information.', icon:'user',\n  cls:{ top:'border-t-indigo-500', soft:'bg-indigo-50 text-indigo-700', bar:'bg-indigo-500', dot:'bg-indigo-500' },\n  run(D) {\n    const p = D.profile;\n    if (!D.hasProfile) return { summary:'No profile found yet', result:{ hasProfile:false } };\n    const checks = [['Name',p.name,'profile.html'],['Email',p.email,'profile.html'],['College',p.college,'profile.html'],['Department',p.department,'profile.html'],['Year of study',p.year,'profile.html'],\n      ['Career goal',D.goal,'profile.html'],['At least one skill',p.skills.length,'profile.html'],['At least one project',p.projects.length,'profile.html']];\n    const missing = checks.filter(c => !c[1]).map(c => ({ label:c[0], href:c[2] }));\n    const notes = [];\n    if (!p.certs.length) notes.push('No certifications listed (optional, but they strengthen a profile).');\n    if (!(p.interests || []).length) notes.push('No interests saved in your profile, so this agent infers them from your department, skills and career goal.');\n    const interests = (p.interests || []).length ? p.interests.slice(0, 8) : [...new Set([p.department, D.goal, ...p.skills.map(s => s.name)].filter(Boolean))].slice(0, 8);\n    const completeness = Math.round((checks.length - missing.length) / checks.length * 100);\n    return { summary:`${completeness}% complete \u00b7 ${missing.length ? missing.length + ' item' + (missing.length > 1 ? 's' : '') + ' missing' : 'nothing missing'}`,\n      result:{ hasProfile:true, name:p.name, education:[p.department, p.year, p.college].filter(Boolean).join(' \u00b7 '), goal:D.goal, skills:p.skills.map(s => ({ name:s.name, level:s.level || 'Beginner' })),\n        certs:p.certs.length, projects:p.projects.length, interests, completeness, missing, notes } };\n  } },\n{ id:2, name:'Skill Analysis Agent', purpose:'Finds strong and weak skills, calculates readiness and picks what to improve first.', icon:'chart',\n  cls:{ top:'border-t-sky-500', soft:'bg-sky-50 text-sky-700', bar:'bg-sky-500', dot:'bg-sky-500' },\n  run(D) {\n    const names = D.goal ? ORDER[D.goal] : ALL_SKILLS.filter(n => D.ev(n));\n    const rows = names.map(n => { const e = D.ev(n); return { name:n, score:e ? Math.round(e.score) : null, status:e ? e.status : 'unknown', source:e ? e.source : 'no data' }; });\n    const known = rows.filter(r => r.score !== null);\n    if (!known.length) return { summary:'No assessment or skill data yet', result:{ hasData:false, goal:D.goal, rows } };\n    let readiness = (D.SG && D.SG.career === D.goal && typeof D.SG.readiness === 'number') ? Math.round(D.SG.readiness) : Math.round(rows.reduce((s, r) => s + (r.score || 0), 0) / rows.length);\n    const strong = rows.filter(r => r.status === 'strong'), weak = rows.filter(r => r.status === 'improve'), missing = rows.filter(r => r.status === 'missing' || r.status === 'unknown');\n    const weakest = rows.filter(r => r.score !== null && r.status !== 'strong').sort((a, b) => a.score - b.score).slice(0, 3).map(r => r.name);\n    const priority = rows.filter(r => r.status !== 'strong').sort((a, b) => (a.score ?? -1) - (b.score ?? -1)).slice(0, 3);\n    return { summary:`Readiness ${readiness}% \u00b7 ${strong.length} strong \u00b7 ${weak.length + missing.length} to improve`,\n      result:{ hasData:true, goal:D.goal, readiness, rows, strong:strong.map(r => r.name), weakest, weak:weak.map(r => r.name), missing:missing.map(r => r.name), priority, assessedOn:D.A ? D.A.takenAt : null, scope:D.goal ? 'skills for ' + D.goal : 'all skills with data' } };\n  } },\n{ id:3, name:'Career Recommendation Agent', purpose:'Ranks careers by fit and compares your skills with what each career needs.', icon:'target',\n  cls:{ top:'border-t-emerald-500', soft:'bg-emerald-50 text-emerald-700', bar:'bg-emerald-500', dot:'bg-emerald-500' },\n  run(D) {\n    const anyEvidence = ALL_SKILLS.some(n => D.ev(n));\n    if (!anyEvidence && !D.goal) return { summary:'Needs skills or an assessment', result:{ list:[], anyEvidence:false } };\n    const list = CAREERS.map(c => {\n      const req = ORDER[c].map(n => { const e = D.ev(n); return { name:n, score:e ? Math.round(e.score) : null, status:e ? e.status : 'unknown' }; });\n      const base = Math.round(req.reduce((s, r) => s + (r.score || 0), 0) / req.length);\n      const match = Math.min(100, base + (c === D.goal ? 8 : 0));\n      const have = req.filter(r => r.status === 'strong'), started = req.filter(r => r.status === 'improve'), gaps = req.filter(r => r.status === 'missing' || r.status === 'unknown');\n      const reasons = [];\n      if (have.length) reasons.push(`You are already strong in ${have.map(r => r.name).join(', ')}.`);\n      if (started.length) reasons.push(`You have a base in ${started.map(r => r.name).join(', ')} that needs more practice.`);\n      if (!have.length && !started.length) reasons.push('None of the required skills show evidence yet.');\n      if (c === D.goal) reasons.push('This is the career goal you selected (+8 points).');\n      return { career:c, match, req, have:have.map(r => r.name), gaps:gaps.map(r => r.name), reasons, isGoal:c === D.goal };\n    }).sort((a, b) => b.match - a.match);\n    const top = anyEvidence ? list.slice(0, 3) : list.filter(x => x.isGoal);\n    return { summary:top.length ? `Best fit: ${top[0].career} (${top[0].match}%)` : 'No recommendation yet', result:{ list:top, anyEvidence, allScores:list.map(x => ({ career:x.career, match:x.match })) } };\n  } },\n{ id:4, name:'Learning Path Agent', purpose:'Builds a roadmap of courses, exercises and projects, weakest skills first.', icon:'route',\n  cls:{ top:'border-t-amber-500', soft:'bg-amber-50 text-amber-700', bar:'bg-amber-500', dot:'bg-amber-500' },\n  run(D, R) {\n    const topCareer = R[3] && R[3].list && R[3].list[0] ? R[3].list[0].career : '';\n    const career = D.goal || topCareer;\n    if (!career) return { summary:'Choose a career goal first', result:{ career:'', items:[] } };\n    const prevH = D.hist.length >= 2 ? D.hist[D.hist.length - 2] : null, lastH = D.hist[D.hist.length - 1];\n    const drop = n => { if (!prevH) return 0; const a = prevH.skills.find(s => s.name === n), b = lastH.skills.find(s => s.name === n); return a && b ? a.percent - b.percent : 0; };\n    const rows = ORDER[career].map((n, i) => { const e = D.ev(n); return { name:n, i, score:e ? Math.round(e.score) : null, status:e ? e.status : 'unknown', drop:drop(n) }; });\n    const rank = r => (r.score ?? -1) - (r.drop >= 10 ? 20 : 0);   // a drop of 10+ points moves the skill up the roadmap\n    const todo = rows.filter(r => r.status !== 'strong').sort((a, b) => (rank(a) - rank(b)) || a.i - b.i);\n    const doneIds = D.LP ? D.LP.completed : {};\n    const items = todo.map(r => {\n      const c = CAT[r.name], back = r.drop >= 10, m = r.status !== 'improve' || back, h = m ? c[4] : c[5];\n      const finished = doneIds[slug(r.name) + ':study'] && doneIds[slug(r.name) + ':practice'];\n      const adapt = back ? `Score dropped ${r.drop} points since the previous assessment, so this skill moved up and restarts from the basics.` : finished ? 'Both activities are done but the score is still below strong. Retake the assessment, then repeat the practice task with a new example.' : '';\n      return { skill:r.name, score:r.score, status:r.status, adapt, acts:[\n        { id:slug(r.name) + ':study', kind:'Course or tutorial', title:c[0], url:c[1], hours:h[0] },\n        { id:slug(r.name) + ':practice', kind:h[1] >= 4 ? 'Mini-project' : 'Practical exercise', title:m ? c[2] : c[3], hours:h[1] } ] };\n    });\n    const hours = items.reduce((s, it) => s + it.acts.reduce((t, a) => t + a.hours, 0), 0);\n    return { summary:items.length ? `${items.length} skill${items.length > 1 ? 's' : ''} \u00b7 ${items.length * 2} activities \u00b7 ~${hours} h` : `No gaps found for ${career}`,\n      result:{ career, assumed:!D.goal, items, strong:rows.filter(r => r.status === 'strong').map(r => r.name), hours, weeks:Math.ceil(hours / PACE), capstone:CAPSTONE[career],\n        hasEvidence:rows.some(r => r.score !== null) } };\n  } },\n{ id:5, name:'Progress Monitoring Agent', purpose:'Tracks completed activities, assessment trends and where you are falling behind.', icon:'activity',\n  cls:{ top:'border-t-rose-500', soft:'bg-rose-50 text-rose-700', bar:'bg-rose-500', dot:'bg-rose-500' },\n  run(D, R) {\n    const path = R[4] || { items:[] }, done = D.LP ? D.LP.completed : {};\n    const acts = path.items.flatMap(it => it.acts.map(a => ({ ...a, skill:it.skill, doneAt:done[a.id] || null })));\n    const completed = acts.filter(a => a.doneAt), remaining = acts.filter(a => !a.doneAt);\n    const pct = acts.length ? Math.round(completed.length / acts.length * 100) : 0;\n    const last = completed.map(a => a.doneAt).sort().pop() || (D.LP && D.LP.updatedAt) || null;\n    const daysIdle = last ? Math.floor((Date.now() - new Date(last)) / 864e5) : null;\n    const perSkill = path.items.map(it => ({ skill:it.skill, done:it.acts.filter(a => done[a.id]).length, total:it.acts.length }));\n    const behind = [];\n    if (acts.length && !completed.length) behind.push('No learning activity has been marked complete yet.');\n    perSkill.filter(s => s.done === 0 && completed.length).forEach(s => behind.push(`${s.skill} has not been started, although other skills have progress.`));\n    if (remaining.length && daysIdle !== null && daysIdle > 7) behind.push(`No activity completed for ${daysIdle} days.`);\n    if (D.LP && D.LP.career && path.career && D.LP.career !== path.career) behind.push(`Saved progress belongs to ${D.LP.career}, not ${path.career}, so it is not counted here.`);\n    let trend = null;\n    if (D.hist.length >= 2) {\n      const a = D.hist[D.hist.length - 2], b = D.hist[D.hist.length - 1];\n      const prev = {}; a.skills.forEach(s => prev[s.name] = s.percent);\n      const deltas = b.skills.filter(s => s.name in prev).map(s => ({ name:s.name, delta:s.percent - prev[s.name] }));\n      trend = { from:a.percent, to:b.percent, attempts:D.hist.length, improved:deltas.filter(d => d.delta > 0), declined:deltas.filter(d => d.delta < 0) };\n      trend.declined.forEach(d => behind.push(`${d.name} dropped ${Math.abs(d.delta)} points between your last two assessments.`));\n    }\n    let next;\n    if (!acts.length) next = { text:'Complete your career goal and assessment so a learning plan can be built.', href:'assessment.html', label:'Open assessment' };\n    else if (remaining.length) next = { text:`${remaining[0].kind}: ${remaining[0].title} (${remaining[0].skill}, ~${remaining[0].hours} h)`, href:'learning-recommendations.html', label:'Open learning plan' };\n    else next = { text:'All planned activities are done. Retake the assessment to confirm your improvement.', href:'assessment.html', label:'Retake assessment' };\n    return { summary:acts.length ? `${completed.length}/${acts.length} done (${pct}%) \u00b7 ${remaining.length} remaining` : 'No learning plan to track yet',\n      result:{ total:acts.length, completed:completed.length, remaining:remaining.length, pct, last, daysIdle, perSkill, behind, trend, next, hasProgressData:!!D.LP } };\n  } },\n{ id:6, name:'Coordinator Agent', purpose:'Combines all agent outputs, flags conflicts and writes the final report.', icon:'layers',\n  cls:{ top:'border-t-violet-500', soft:'bg-violet-50 text-violet-700', bar:'bg-violet-500', dot:'bg-violet-500' },\n  run(D, R) {\n    const [r1, r2, r3, r4, r5] = [R[1], R[2], R[3], R[4], R[5]];\n    const top = r3.list && r3.list[0], goalFit = r3.list && r3.list.find(x => x.isGoal);\n    const conflicts = [], add = (issue, resolution) => conflicts.push({ issue, resolution });\n    let direction = D.goal || (top ? top.career : '');\n    if (!D.goal && top) add('No career goal is saved.', `Used Agent 3\u2019s best-fit career, ${top.career}, as a provisional direction. Choose a goal in your profile to confirm it.`);\n    if (D.goal && top && top.career !== D.goal && goalFit && top.match >= goalFit.match + 15) {\n      const switchIt = goalFit.match < 40 && !(r5.completed > 0);\n      add(`Agent 3 sees a stronger fit with ${top.career} (${top.match}%) than with your goal, ${D.goal} (${goalFit.match}%).`,\n        switchIt ? `Your skills for ${D.goal} are still low and you have not started its plan, so ${top.career} is recommended as the final direction. ${D.goal} stays as your selected goal until you change it.` : `Kept ${D.goal} as the direction because you already have progress or a reasonable base there. ${top.career} is a backup option.`);\n      if (switchIt) direction = top.career;\n    }\n    if (D.goal && D.SG && D.SG.career !== D.goal) add(`The saved skill-gap analysis is for ${D.SG.career}, but your goal is ${D.goal}.`, 'Skills are scored one by one, so skills it covers are still used. Others fall back to assessment or profile data. Re-run the skill gap for exact results.');\n    if (D.goal && D.A && D.A.career && D.A.career !== D.goal) add(`Your last assessment was taken for ${D.A.career}, not ${D.goal}.`, 'Per-skill scores are still used. Retake the assessment for your current goal for more relevant results.');\n    if (D.A && !D.SG) add('An assessment exists but there is no skill-gap analysis.', 'Skill levels come from the assessment percentages instead.');\n    (r1.skills || []).forEach(s => { const c = canon(s.name), e = c && D.A ? D.A.skills.find(x => x.name === c) : null;\n      if (e && (s.level === 'Advanced' || s.level === 'Intermediate') && e.percent < 40) add(`You rated ${s.name} as ${s.level}, but the assessment shows ${e.percent}%.`, 'The measured assessment score is used instead of the self-rating.'); });\n    if (r5.trend && r5.trend.declined.length) add('Some skills declined between assessment attempts, while a plan assumes steady improvement.', 'Agent 4 moves drops of 10+ points up the roadmap and restarts those skills from the basics.');\n    const prio = (r2.priority || []).map(x => x.name);\n    const strategy = !direction ? 'Select a career goal and take the assessment so the agents have something to analyze.'\n      : [`Work toward ${direction}${D.goal ? '' : ' (provisional)'}.`,\n         prio.length ? `Improve ${prio.join(', then ')} first, because they are your lowest-scoring required skills.` : 'Your required skills look strong, so focus on a capstone project.',\n         r4.items && r4.items.length ? `Finish the ${r5.remaining ?? 0} remaining activities (about ${r4.hours} hours, roughly ${r4.weeks} week${r4.weeks > 1 ? 's' : ''} at ${PACE} h/week), then retake the assessment.` : '',\n         r4.capstone ? `Finish with ${r4.capstone}.` : '', (D.goal && r4.career && direction !== r4.career) ? `The roadmap below is still for ${r4.career}; update your goal to follow ${direction}.` : ''].filter(Boolean).join(' ');\n    const actions = [];\n    if (!D.hasProfile) actions.push({ text:'Create your profile so the agents know your education and skills.', href:'profile.html', label:'Open profile' });\n    else if (r1.missing && r1.missing.length) actions.push({ text:`Complete your profile: add ${r1.missing.slice(0, 3).map(m => m.label.toLowerCase()).join(', ')}.`, href:'profile.html', label:'Edit profile' });\n    if (!D.goal) actions.push({ text:'Choose a career goal in your profile.', href:'profile.html', label:'Choose goal' });\n    if (!D.A) actions.push({ text:'Take the skills assessment to measure your current level.', href:'assessment.html', label:'Take assessment' });\n    if (D.A && (!D.SG || (D.goal && D.SG.career !== D.goal))) actions.push({ text:'Run the skill-gap analysis for your current career goal.', href:'skill-gap.html', label:'Open skill gap' });\n    if (r5.next && r4.items && r4.items.length) actions.push({ text:'Next learning step: ' + r5.next.text, href:r5.next.href, label:r5.next.label });\n    if (prio[0] && D.A) actions.push({ text:`Spend extra practice time on ${prio[0]}, your weakest required skill.`, href:'learning-recommendations.html', label:'Open learning plan' });\n    actions.push({ text:'Retake the assessment after finishing a skill to track improvement.', href:'assessment.html', label:'Open assessment' },\n                  { text:'Review your overall progress and trends.', href:'dashboard.html', label:'Open dashboard' },\n                  { text:'Ask the AI Mentor for help with a topic you find difficult.', href:'ai-mentor.html', label:'Open AI Mentor' });\n    const report = {\n      profile:{ name:r1.name || '', line:r1.education || '', completeness:r1.completeness ?? null, hasProfile:!!r1.hasProfile, skills:r1.skills || [] },\n      strong:r2.strong || [], weakest:r2.weakest || [], improve:[...(r2.weak || []), ...(r2.missing || [])], readiness:r2.readiness ?? null,\n      careers:(r3.list || []).map(x => ({ career:x.career, match:x.match })), goal:D.goal essment to get recommendations.<\/p>')}\n   ${sec('Assessment performance', p.assessment ? `<p class=\"text-sm\">Latest score: <b>${p.assessment.percent ?? '\u2013'}%<\/b>${p.assessment.total ? ` (${p.assessment.correct}/${p.assessment.total} correct)` : ''}<\/p><p class=\"mt-1 text-xs text-slate-500\">Taken ${esc(fmt(p.assessment.takenAt))} \u00b7 ${p.assessment.attempts} attempt${p.assessment.attempts === 1 ? '' : 's'} saved<\/p>${p.assessment.trend ? `<p class=\"mt-2 text-sm\">Trend: ${p.assessment.trend.from}% \u2192 ${p.assessment.trend.to}%<\/p>` : ''}` : empty('No assessment taken yet.', 'assessment.html', 'Take assessment'))}\n   ${sec('Current learning progress', p.progress.total ? `<div class=\"flex items-center gap-3\">${bar(p.progress.pct, 'bg-rose-500')}<b class=\"text-sm\">${p.progress.pct}%<\/b><\/div><p class=\"mt-2 text-sm text-slate-600\">${p.progress.done} of ${p.progress.total} activities completed<\/p>` : '<p class=\"text-sm text-slate-500\">No learning plan to track yet.<\/p>')}\n   ${sec('Personalized learning roadmap' + (p.roadmapCareer ? ' for ' + esc(p.roadmapCareer) : ''), p.roadmap.length ? `<ol class=\"space-y-3 text-sm\">${p.roadmap.map((s, i) => `<li><p class=\"font-bold\">${i + 1}. ${esc(s.skill)} ${pill(STATUS_LABEL[s.status], STATUS_CLS[s.status])}<\/p>${list(s.acts.map(esc))}<\/li>`).join('')}<\/ol>` : '<p class=\"text-sm text-slate-500\">No roadmap items. Set a goal and take the assessment.<\/p>', 'md:col-span-2')}\n   ${sec('Three recommended next actions', `<ol class=\"space-y-3\">${p.actions.map((x, i) => `<li class=\"flex items-start gap-3\"><span class=\"ib h-7 w-7 shrink-0 rounded-full text-sm font-extrabold\">${i + 1}<\/span><div class=\"text-sm\"><p>${esc(x.text)}<\/p><a class=\"font-bold text-bp underline\" href=\"${x.href}\">${esc(x.label)}<\/a><\/div><\/li>`).join('')}<\/ol>`, 'md:col-span-2')}\n   ${p.conflicts.length ? sec('Conflicts found and how the Coordinator resolved them', confList(p.conflicts), 'md:col-span-2') : ''}\n   <\/div><\/div>`;\n  $('printBtn').onclick = () => window.print();\n}\n\nfunction renderBanner(D) {\n  const miss = [];\n  if (!D.hasProfile) miss.push(['Profile', 'profile.html']);\n  if (!D.goal) miss.push(['Career goal', 'profile.html']);\n  if (!D.A) miss.push(['Assessment result', 'assessment.html']);\n  if (!D.SG) miss.push(['Skill-gap analysis', 'skill-gap.html']);\n  if (!D.LP) miss.push(['Learning progress', 'learning-recommendations.html']);\n  let h = '';\n  if (miss.length) h += note(`<b>Some student data is missing.<\/b> Agents still run, but with less detail. Missing: ${miss.map(m => lnk(m[1], m[0])).join(' \u00b7 ')}`);\n  else h += note('All student data sources were found. The agents are using your saved profile, goal, assessment, skill gap and learning progress.', 'emerald');\n  if (D.ignored.length) h += `<div class=\"mt-2\">${note('Ignored data that belongs to a different student: ' + esc(D.ignored.join(', ')) + '.', 'sky')}<\/div>`;\n  $('banner').innerHTML = h;\n}\n\nfunction render(D) {\n  const done = AGENTS.filter(a => S[a.id] && S[a.id].status === 'completed').length;\n  $('runAll').innerHTML = running ? `${icon('loader', 18, 'spin')} Running\u2026` : `${icon('play', 18)} Run All Agents`;\n  $('runAll').disabled = running; $('resetBtn').disabled = running;\n  $('flowT').innerHTML = `${icon('route', 20)} Agent collaboration workflow <span class=\"text-sm font-semibold text-slate-500\">(${done} of 6 completed)<\/span>`;\n  $('updated').textContent = updatedAt ? 'Last updated: ' + fmt(updatedAt) : 'Agents have not run yet.';\n  $('stepper').innerHTML = AGENTS.map((a, i) => {\n    const st = (S[a.id] && S[a.id].status) || 'waiting';\n    const circ = st === 'completed' ? 'bg-emerald-500 text-white' : st === 'working' ? `${a.cls.dot} text-white animate-pulse` : 'bg-slate-200 text-slate-500';\n    return `<li class=\"relative flex flex-col items-center text-center\">${i ? `<span class=\"absolute right-1/2 top-4 -z-0 h-1 w-full ${(S[AGENTS[i - 1].id] || {}).status === 'completed' ? 'bg-emerald-400' : 'bg-slate-200'}\"><\/span>` : ''}<span class=\"relative z-10 grid h-9 w-9 place-items-center rounded-full text-sm font-extrabold ${circ}\">${st === 'completed' ? icon('check', 18) : a.id}<\/span><span class=\"mt-1 hidden text-xs font-semibold text-slate-600 sm:block\">${esc(a.name.replace(' Agent', ''))}<\/span><\/li>`;\n  }).join('');\n  $('agents').innerHTML = AGENTS.map((a, i) => {\n    const s = S[a.id] || { status:'waiting' }, st = s.status;\n    const stCls = st === 'completed' ? 'bg-emerald-100 text-emerald-700' : st === 'working' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600';\n    return `<article class=\"card flex flex-col border-t-4 !p-5 ${a.cls.top}\"><div class=\"flex items-start justify-between gap-2\"><span class=\"grid h-11 w-11 place-items-center rounded-xl ${a.cls.soft}\">${icon(a.icon, 22)}<\/span>${pill(st === 'completed' ? '\u2713 Completed' : st === 'working' ? 'Working\u2026' : 'Waiting', stCls)}<\/div>\n      <h3 class=\"mt-3 text-base font-extrabold\">Agent ${a.id}: ${esc(a.name)}<\/h3><p class=\"mt-1 text-sm text-slate-600\">${esc(a.purpose)}<\/p>\n      <div class=\"mt-3 min-h-[3.5rem] flex-1 rounded-xl ${a.cls.soft} px-3 py-2 text-sm\"><p class=\"text-xs font-bold opacity-70\">Main result<\/p><p class=\"font-bold\">${st === 'working' ? 'Analyzing\u2026' : s.summary ? esc(s.summary) : 'Not run yet'}<\/p><\/div>\n      <div class=\"mt-3 flex flex-wrap gap-2 noprint\"><button class=\"btn-p btn-s\" data-run=\"${a.id}\" ${running ? 'disabled' : ''}>${icon('play', 14)} Run Agent<\/button><button class=\"btn-o btn-s\" data-view=\"${a.id}\">View Details<\/button><\/div>\n      <p class=\"mt-3 text-xs text-slate-400\">${i < 5 ? 'Passes findings to Agent ' + (a.id + 1) : 'Produces the final report'}${s.ranAt ? ' \u00b7 ran ' + esc(fmt(s.ranAt)) : ''}<\/p><\/article>`;\n  }).join('');\n  const sel = AGENTS[selected - 1], r = S[selected];\n  $('detailT').innerHTML = `${icon(sel.icon, 22)} Detailed analysis`;\n  $('detailTabs').innerHTML = AGENTS.map(a => `<button role=\"tab\" aria-selected=\"${a.id === selected}\" data-view=\"${a.id}\" class=\"shrink-0 rounded-lg border-2 px-3 py-1 text-sm font-bold transition ${a.id === selected ? 'border-bp bg-bs text-bp' : 'border-violet-100 bg-white text-slate-600 hover:border-bp/50'}\">${a.id}. ${esc(a.name.replace(' Agent', ''))}<\/button>`).join('');\n  $('detail').innerHTML = `<h3 class=\"mb-3 text-xl font-extrabold\">${esc(sel.name)}<\/h3>` + (r && r.status === 'completed' ? DETAIL[selected](r.result) :\n    `<div class=\"rounded-xl bg-bs px-4 py-6 text-center text-sm text-slate-600\">This agent has not run yet.<span class=\"mt-3 block\"><button class=\"btn-p btn-s\" data-run=\"${selected}\" ${running ? 'disabled' : ''}>${icon('play', 14)} Run this agent<\/button><\/span><\/div>`);\n  renderReport(); renderBanner(D);\n}\n\n/* ---------- 7. Controller ---------- */\nasync function runOne(n, quiet) {\n  S[n] = { ...(S[n] || {}), status:'working' }; render(load());\n  await sleep(quiet ? 120 : 450);\n  const D = load(), out = AGENTS[n - 1].run(D, chain(D, n));\n  S[n] = { status:'completed', ranAt:new Date().toISOString(), summary:out.summary, result:out.result };\n  persist(D); render(D);\n}\nasync function runSingle(n) {\n  if (running) return; running = true; selected = n; $('runMsg').textContent = `Running agent ${n}\u2026`;\n  try { await runOne(n); } finally { running = false; }\n  const D = load(); render(D); $('runMsg').textContent = `${AGENTS[n - 1].name} finished. It used the latest saved data.`; toast(AGENTS[n - 1].name + ' completed.');\n  if (n < 6 && S[6] && S[6].status === 'completed') $('runMsg').textContent += ' Run the Coordinator again to update the report.';\n}\nasync function runAll(auto) {\n  if (running) return; running = true; S = {}; render(load());\n  try { for (let n = 1; n <= 6; n++) { $('runMsg').textContent = `${auto ? 'Your data changed. ' : ''}Running agent ${n} of 6: ${AGENTS[n - 1].name}\u2026`; await runOne(n, auto); } }\n  finally { running = false; }\n  selected = 6; render(load());\n  $('runMsg').textContent = 'All six agents completed. The final report is ready below.';\n  toast(auto ? 'Data changed: agents refreshed and report updated.' : 'All agents completed.');\n}\nfunction checkForChanges() {   /* learner changed goal / assessment / skill gap / progress on another page \u2192 refresh */\n  if (running) return; const D = load(); restoreIfNeeded(D);\n  if (Object.values(S).some(a => a.status === 'completed') && D.sig !== storedSig) runAll(true);\n}\nfunction restoreIfNeeded(D) { const st = Store.read(RESULT_KEY, null); if (!Object.keys(S).length && st && st.email === D.email) restore(D); }\n\nfunction init() {\n  $('logo').innerHTML = icon('route', 22);\n  const nav = NAV.map(([t, h]) => h === 'multi-agent.html' ? `<li><a class=\"rounded-lg bg-bs px-3 py-1 text-bp\" href=\"${h}\" aria-current=\"page\">${t}<\/a><\/li>` : `<li><a class=\"rounded-lg px-2 py-1 text-ink/80 transition hover:text-bp\" href=\"${h}\">${t}<\/a><\/li>`).join('');\n  $('navDesk').innerHTML = $('navMob').innerHTML = nav;\n  document.addEventListener('click', e => {\n    const r = e.target.closest('[data-run]'), v = e.target.closest('[data-view]');\n    if (r) runSingle(+r.dataset.run);\n    else if (v) { selected = +v.dataset.view; render(load()); if (v.closest('#agents')) $('detailSec').scrollIntoView({ behavior:'smooth', block:'start' }); }\n  });\n  $('runAll').onclick = () => runAll(false);\n  $('resetBtn').onclick = () => { if (running) return; Store.remove(RESULT_KEY); S = {}; storedSig = ''; updatedAt = ''; render(load()); $('runMsg').textContent = 'Agent results cleared. Your profile, assessment and progress were not touched.'; toast('Agent results cleared.'); };\n  window.addEventListener('storage', checkForChanges);\n  window.addEventListener('focus', checkForChanges);\n  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForChanges(); });\n  const D = load(); restore(D); render(D);\n  if (Object.values(S).some(a => a.status === 'completed') && D.sig !== storedSig) runAll(true);\n}\nif (typeof document !== 'undefined' && document.getElementById('runAll')) init();\n<\/script>\n<\/body>\n<\/html>\n"};
const PRE="<script>window.SPNAV=u=>parent.SPgo(u);\ndocument.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href');\nif(/^[\\w-]+\\.html(\\?[^#]*)?(#.*)?$/.test(h)){e.preventDefault();SPNAV(h);}});<\/script>";
function render(name,q){const f=document.getElementById('app');
const pre=PRE.replace('<script>','<script>window.__SP_PAGE='+JSON.stringify(name)+';window.__SP_QUERY='+JSON.stringify(q||'')+';');
f.srcdoc=PAGES[name].replace(/<head[^>]*>/i,x=>x+pre);}
function SPgo(u){const m=u.match(/^([\w-]+\.html)(\?[^#]*)?(#.*)?$/);if(!m||!PAGES[m[1]])return;
const name=m[1],h=m[3]||'';render(name,m[2]);
try{const hs=name.replace('.html','');if(location.hash.slice(1)!==hs)history.pushState(null,'','#'+hs);}catch(e){}
if(h){const f=document.getElementById('app');f.onload=()=>{try{f.contentDocument.querySelector(h).scrollIntoView()}catch(e){}};}}
addEventListener('popstate',()=>{const n=location.hash.slice(1)+'.html';if(PAGES[n])render(n);});
const first=location.hash.slice(1)+'.html';render(PAGES[first]?first:'skillpath-ai-homepage.html');</script></body></html>
